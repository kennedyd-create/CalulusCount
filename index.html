/* =========================================================================
   PAPER ENGINE — Test Mode & Exam Mode share this one engine.
   Test Mode: an untimed, full-standard diagnostic — mixed A/M/E questions
   across every topic, nothing revealed until you submit.
   Exam Mode: the same idea but harder-weighted (more Explain/Apply/Worked,
   less Recognise) and genuinely TIMED — a countdown runs from the moment
   you start, and the paper auto-submits if time runs out, same as sitting
   the real thing.

   paperState is persisted to localStorage (not just an in-memory variable)
   so a reload — or closing the tab and coming back — does not wipe an
   attempt in progress: the exam countdown uses a wall-clock "endsAt"
   timestamp rather than a plain counter, so it stays correct even after a
   reload recomputes "time remaining" from scratch.
   ========================================================================= */
const PAPER_LABELS = {recognise:"Quick Quiz",build:"Fill the Gap",explain:"Explain",apply:"Apply",worked:"Worked / calculation"};
const PAPER_LEVEL = {recognise:"Achievement",build:"Achievement / Merit",explain:"Merit / Excellence",apply:"Merit / Excellence",worked:"Excellence"};
/* Placeholder exam duration, pending the real NZQA time-per-standard figure
   — change these three numbers (minutes) once confirmed; nothing else
   needs to change. Test Mode is deliberately untimed, matching a
   diagnostic "mixed A/M/E, marked at the end" self-check rather than a
   simulated sitting. */
const EXAM_DURATION_MIN = {"91577":60,"91578":60,"91579":60};

let paperState=null;
let lastPaperIds={test:{},exam:{}};
let examTimerHandle=null;

function persistPaperState(){
  try{
    if(paperState) localStorage.setItem("calc_count_active_paper", JSON.stringify(paperState));
    else localStorage.removeItem("calc_count_active_paper");
  }catch(e){}
}
function restorePaperState(){
  try{
    const raw=localStorage.getItem("calc_count_active_paper");
    if(!raw) return;
    const restored=JSON.parse(raw);
    if(restored && restored.standard && standards[restored.standard]) paperState=restored;
  }catch(e){}
}
function formatDuration(sec){
  const m=Math.floor(sec/60), s=sec%60;
  return String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
}
function stopExamTimer(){
  if(examTimerHandle){ clearInterval(examTimerHandle); examTimerHandle=null; }
}
function startExamTimerIfNeeded(){
  stopExamTimer();
  if(paperState && paperState.kind==="exam" && !paperState.submitted && paperState.endsAt){
    examTimerHandle=setInterval(tickExamTimer,1000);
    tickExamTimer();
  }
}
function tickExamTimer(){
  if(!paperState || paperState.kind!=="exam" || paperState.submitted){ stopExamTimer(); return; }
  const remain=Math.max(0, Math.round((paperState.endsAt-Date.now())/1000));
  const el=document.getElementById("examTimerDisplay");
  if(el) el.textContent=formatDuration(remain);
  if(remain<=60 && remain>0){ if(el) el.style.color="var(--wine)"; }
  if(remain<=0){
    stopExamTimer();
    submitPaper(true);
  }
}

function buildPaperItems(standardId, kind){
  const s = standards[standardId];
  const prevIds = (lastPaperIds[kind] && lastPaperIds[kind][standardId]) || [];
  // Test: a balanced diagnostic spread across every AO level. Exam: fewer
  // recognition items, more of the higher-order calculation/explanation
  // work a real exam paper leans on.
  const composition = kind==="test"
    ? [["recognise",3],["build",3],["explain",2],["apply",2],["worked",2]]
    : [["recognise",2],["build",2],["explain",3],["apply",3],["worked",3]];
  const picked=[];
  composition.forEach(([act,count])=>{
    const basePool=(s[act]||[]).filter(it=>act!=="recognise" || it.type!=="match");
    if(!basePool.length) return;
    const fresh=basePool.filter(it=>!prevIds.includes(it.id));
    const source=shuffle(fresh.length>=count ? fresh : basePool);
    const chosen=[]; const usedTopics=new Set();
    source.forEach(it=>{ if(chosen.length<count && !usedTopics.has(it.topic)){ chosen.push(it); usedTopics.add(it.topic); } });
    source.forEach(it=>{ if(chosen.length<count && !chosen.includes(it)) chosen.push(it); });
    chosen.slice(0,count).forEach(it=>picked.push({...it, activity:act}));
  });
  return shuffle(picked);
}

function paperStage(s, kind){
  if(!paperState || paperState.standard!==s.id || paperState.kind!==kind) return paperIntro(s,kind);
  if(!paperState.submitted) return renderPaperRunning(s);
  return renderPaperResults(s);
}

function paperIntro(s,kind){
  const preview=buildPaperItems(s.id,kind);
  const counts={};
  preview.forEach(it=>counts[it.activity]=(counts[it.activity]||0)+1);
  const kindLabel = kind==="test" ? "Test" : "Exam";
  const durationMin = EXAM_DURATION_MIN[s.id];
  return `<section class="surface-strong p-6 md:p-8">
    <div class="kicker text-${s.colour}-700">${kindLabel} Mode — AS ${s.id}</div>
    <h1 class="text-3xl font-bold mt-1">${kind==="test" ? "A full-standard test" : "An authentic exam simulation"}</h1>
    <p class="mt-3 max-w-2xl" style="color:var(--muted)">${kind==="test"
      ? "Draws a fresh mix of questions from across every topic in this standard — Achievement, Merit and Excellence, calculation and explanation together. No feedback is shown until you submit; you'll then get a score, a topic-by-topic breakdown and what to revise next."
      : `One continuous paper across the whole standard, with no scaffolding while you work — the closest thing here to sitting the real thing. You'll have ${durationMin} minutes on the clock; it auto-submits if time runs out. Nothing is marked or revealed until you finish, then you get full worked solutions and a breakdown.`}</p>
    <div class="mt-5 flex flex-wrap gap-2 text-xs font-semibold" style="color:var(--ink-soft)">
      ${["recognise","build","explain","apply","worked"].filter(a=>counts[a]).map(a=>`<span class="px-2.5 py-1 rounded-full" style="background:var(--surface-2)">${counts[a]} × ${PAPER_LABELS[a]}</span>`).join("")}
      ${kind==="exam"?`<span class="px-2.5 py-1 rounded-full" style="background:var(--surface-2)">${icon("clock",12)} ${durationMin} minutes</span>`:""}
    </div>
    <button onclick="startPaper('${s.id}','${kind}')" class="mt-6 btn-ink px-5 py-3">Start ${kindLabel.toLowerCase()} →</button>
  </section>`;
}

function startPaper(standardId, kind){
  const items=buildPaperItems(standardId, kind);
  paperState={kind, standard:standardId, items, responses:{}, writtenText:{}, submitted:false, startedAt:Date.now()};
  if(kind==="exam"){
    const durationSec=(EXAM_DURATION_MIN[standardId]||60)*60;
    paperState.durationSec=durationSec;
    paperState.endsAt=Date.now()+durationSec*1000;
  }
  state.standard=standardId; state.stage=kind; state.view="standard"; state.topic=null; state.subtopic=null;
  persistPaperState();
  render(); window.scrollTo(0,0);
  startExamTimerIfNeeded();
}

function exitPaper(){
  stopExamTimer();
  paperState=null;
  persistPaperState();
  render(); window.scrollTo(0,0);
}

function paperItemPrompt(it){ return it.activity==="build" ? it.stem : it.prompt; }
function paperCorrectDisplayIndex(it){
  const order=stableOptionOrder(paperItemPrompt(it), it.options.length);
  return order.indexOf(it.answer);
}
function paperDisplayOptions(it){
  const order=stableOptionOrder(paperItemPrompt(it), it.options.length);
  return order.map(oi=>it.options[oi]);
}

function paperSelect(itemId, idx){
  if(!paperState || paperState.submitted) return;
  paperState.responses[itemId]={choice:idx};
  persistPaperState();
  document.querySelectorAll(`.paper-choice[data-item="${itemId}"]`).forEach(b=>{
    const sel = b.getAttribute("data-idx")===String(idx);
    b.style.borderColor = sel ? "var(--ink)" : "var(--line)";
    b.style.background = sel ? "var(--surface-2)" : "transparent";
  });
}
function paperWriteText(itemId, val){
  if(!paperState || paperState.submitted) return;
  paperState.writtenText[itemId]=val;
  persistPaperState();
}

function paperQuestionCard(it,i,total){
  const num=i+1, level=PAPER_LEVEL[it.activity]||"";
  if(it.activity==="recognise"||it.activity==="build"){
    const shown=paperDisplayOptions(it);
    const sel=paperState.responses[it.id]?.choice;
    return `<article class="surface p-6" data-paperitem="${it.id}">
      <span class="kicker" style="color:var(--muted)">Question ${num} of ${total} — ${level}</span>
      <h3 class="text-lg font-bold mt-3">${paperItemPrompt(it)}</h3>
      <div class="mt-4 space-y-2">${shown.map((text,idx)=>`<button type="button" class="paper-choice w-full text-left p-3 rounded-lg" data-item="${it.id}" data-idx="${idx}" style="border:2px solid ${sel===idx?"var(--ink)":"var(--line)"};background:${sel===idx?"var(--surface-2)":"transparent"}" onclick="paperSelect('${it.id}',${idx})"><span class="inline-flex w-6 h-6 rounded-md items-center justify-center text-xs font-bold mr-2" style="background:var(--surface-2)">${String.fromCharCode(65+idx)}</span>${text}</button>`).join("")}</div>
    </article>`;
  }
  const savedText = paperState.writtenText[it.id]||"";
  return `<article class="surface p-6" data-paperitem="${it.id}">
    <span class="kicker" style="color:var(--muted)">Question ${num} of ${total} — ${level}${it.activity==="worked"?" · calculation":""}</span>
    <h3 class="text-lg font-bold mt-3">${it.title ? it.title+" — "+it.question : it.question}</h3>
    <textarea id="paper-w-${it.id}" oninput="paperWriteText('${it.id}', this.value)" class="answer-lines mt-4 w-full min-h-32 p-4 rounded-xl outline-none" style="border:2px solid var(--line)" placeholder="Write your answer here — nothing is revealed until you submit.">${savedText}</textarea>
  </article>`;
}

function renderPaperRunning(s){
  const items=paperState.items, total=items.length;
  const kindLabel = paperState.kind==="test" ? "Test" : "Exam";
  const remainNow = paperState.kind==="exam" && paperState.endsAt ? Math.max(0,Math.round((paperState.endsAt-Date.now())/1000)) : null;
  return `<div class="space-y-5">
  <section class="rounded-xl p-6" style="background:linear-gradient(135deg,var(--brand-navy) 0%,var(--brand-navy-deep) 100%);color:#fff">
    <div class="flex items-center justify-between gap-3 flex-wrap">
      <div class="flex items-center gap-2"><span style="color:var(--gold)">${icon(paperState.kind==="exam"?"clock":"checklist",18)}</span><div class="kicker" style="color:var(--gold)">${kindLabel} Mode — AS ${s.id}</div></div>
      <div class="flex items-center gap-4">
        ${remainNow!==null?`<span id="examTimerDisplay" class="text-lg font-bold font-mono-num" style="color:${remainNow<=60?"var(--wine)":"#fff"}">${formatDuration(remainNow)}</span>`:""}
        <span class="text-sm font-bold" style="color:rgba(255,255,255,.9)">${total} questions</span>
      </div>
    </div>
    <p class="mt-2 text-sm" style="color:rgba(255,255,255,.85)">Nothing is marked or revealed until you submit${paperState.kind==="exam"?" — work through it as one continuous paper, exactly as you would in the exam room. Time keeps running even if you navigate away.":""}.</p>
  </section>
  ${items.map((it,i)=>paperQuestionCard(it,i,total)).join("")}
  <section class="surface p-6 flex flex-col sm:flex-row items-center justify-between gap-4">
    <div class="text-sm" style="color:var(--muted)">You can leave any question blank and still submit — a blank answer just counts as not attempted.</div>
    <div class="flex gap-2 flex-none">
      <button onclick="if(confirm('Leave without submitting? Your answers are saved, but you will need to come back to finish.')) exitPaper()" class="btn-outline px-4 py-2.5 text-sm">Exit</button>
      <button onclick="submitPaper()" class="btn-ink px-5 py-2.5 text-sm">Submit ${kindLabel} →</button>
    </div>
  </section>
  </div>`;
}

function submitPaper(auto){
  if(!paperState || paperState.submitted) return;
  stopExamTimer();
  paperState.items.forEach(it=>{
    if(it.activity==="recognise"||it.activity==="build"){
      const sel=paperState.responses[it.id]?.choice;
      const attempted = sel!==undefined && sel!==null;
      const ok = attempted && sel===paperCorrectDisplayIndex(it);
      if(attempted) recordResult(it.id, ok);
      paperState.responses[it.id]={choice:sel, attempted, correct: attempted ? ok : null};
    } else {
      // Written answers are kept live in paperState.writtenText by
      // paperWriteText() on every keystroke (see paperQuestionCard's
      // textarea oninput), so that is the source of truth here — not a
      // DOM read, which would miss text if this item's card was never
      // scrolled into view or interacted with after a reload.
      const text = (paperState.writtenText[it.id]||"").trim();
      paperState.writtenText[it.id]=text;
      if(text) markPracticed(it.id);
    }
  });
  lastPaperIds[paperState.kind][paperState.standard]=paperState.items.map(it=>it.id);
  paperState.submitted=true;
  paperState.autoSubmitted=!!auto;

  const autoItems=paperState.items.filter(it=>it.activity==="recognise"||it.activity==="build");
  const autoCorrect=autoItems.filter(it=>paperState.responses[it.id]?.correct).length;
  const writtenItems=paperState.items.filter(it=>it.activity!=="recognise"&&it.activity!=="build");
  const writtenAttempted=writtenItems.filter(it=>paperState.writtenText[it.id]).length;
  progress.paperHistory=progress.paperHistory||[];
  progress.paperHistory.push({
    kind:paperState.kind, standardId:paperState.standard, date:Date.now(),
    autoTotal:autoItems.length, autoCorrect,
    scorePct: autoItems.length ? Math.round(autoCorrect/autoItems.length*100) : null,
    writtenTotal:writtenItems.length, writtenAttempted,
    durationSec: paperState.durationSec||null,
    timeTakenSec: Math.round((Date.now()-paperState.startedAt)/1000),
    autoSubmitted: !!auto
  });
  if(progress.paperHistory.length>50) progress.paperHistory=progress.paperHistory.slice(-50);

  saveProgress();
  persistPaperState();
  render();
  window.scrollTo(0,0);
}

function paperTopicBreakdown(s){
  const byTopic={};
  paperState.items.forEach(it=>{
    if(!byTopic[it.topic]) byTopic[it.topic]={autoTotal:0,autoCorrect:0,writtenTotal:0,writtenAttempted:0};
    const t=byTopic[it.topic];
    if(it.activity==="recognise"||it.activity==="build"){
      t.autoTotal++; if(paperState.responses[it.id]?.correct) t.autoCorrect++;
    } else {
      t.writtenTotal++; if(paperState.writtenText[it.id]) t.writtenAttempted++;
    }
  });
  return Object.keys(byTopic).map(tid=>{
    const t=byTopic[tid], title=(topicMap[s.id]||[]).find(x=>x.id===tid)?.title || tid;
    return {tid, title, autoPct: t.autoTotal? Math.round(t.autoCorrect/t.autoTotal*100) : null, ...t};
  });
}

function weakItemsFromPaper(){
  return paperState.items.filter(it=>{
    if(it.activity==="recognise"||it.activity==="build") return paperState.responses[it.id]?.correct!==true;
    return !paperState.writtenText[it.id];
  });
}

function reviseSubtopic(standardId, topicId, subId){
  state.standard=standardId; state.view="hub"; state.hubTab="topics"; state.topic=topicId; state.subtopic=subId;
  visit(standardId+":"+subId);
  render(); window.scrollTo(0,0);
}

function paperReviewCard(it,i){
  const num=i+1;
  if(it.activity==="recognise"||it.activity==="build"){
    const shown=paperDisplayOptions(it), correctIdx=paperCorrectDisplayIndex(it);
    const r=paperState.responses[it.id]||{};
    const attempted=!!r.attempted, ok=!!r.correct;
    return `<div class="p-4 rounded-lg" style="border:1px solid ${ok?"var(--good)":"var(--wine)"};background:${ok?"var(--good-soft)":"var(--wine-soft)"}">
      <div class="flex justify-between gap-3"><b class="text-sm">Q${num}. ${paperItemPrompt(it)}</b><span class="text-xs font-bold flex-none">${ok?"Correct":attempted?"Incorrect":"Not attempted"}</span></div>
      <div class="text-sm mt-2" style="color:var(--ink-soft)">Your answer: ${attempted?shown[r.choice]:"—"}${ok?"":`<br>Correct answer: ${shown[correctIdx]}`}</div>
      ${it.why?`<div class="text-xs mt-2" style="color:var(--muted)">${it.why}</div>`:""}
    </div>`;
  }
  const text=paperState.writtenText[it.id]||"";
  const mastered=!!progress.mastered[it.id];
  const modelHtml = it.activity==="explain"
    ? `<div class="mt-2 grid sm:grid-cols-2 gap-3 text-sm"><div class="p-3 rounded-lg bg-amber-50 border border-amber-200"><b>Merit model</b><p class="mt-1" style="color:var(--ink-soft)">${it.merit}</p></div><div class="p-3 rounded-lg bg-purple-50 border border-purple-200"><b>Excellence-targeted model</b><p class="mt-1" style="color:var(--ink-soft)">${it.excellence}</p></div></div>`
    : it.activity==="apply"
    ? `<p class="mt-2 text-sm" style="color:var(--ink-soft)"><b>Model response:</b> ${it.answer}</p>`
    : `<div class="mt-2 text-sm" style="color:var(--ink-soft)"><b>Plan:</b> ${(it.plan||[]).join(" → ")}</div><p class="mt-2 text-sm" style="color:var(--ink-soft)"><b>Excellence-targeted answer:</b> ${it.answer}</p><p class="mt-2 text-xs" style="color:var(--muted)"><b>Common trap:</b> ${it.trap}</p>`;
  return `<div class="p-4 rounded-lg" style="background:var(--surface-2)">
    <b class="text-sm">Q${num}. ${it.title ? it.title+" — "+it.question : it.question}</b>
    <div class="mt-2 p-3 rounded-lg text-sm" style="background:var(--surface)"><b style="color:var(--muted)">Your answer:</b> ${text ? text : `<span style="color:var(--muted)">Not attempted</span>`}</div>
    ${modelHtml}
    <div class="mt-3 flex flex-wrap items-center gap-3">
      <button onclick="markMastered('${it.id}',event)" class="px-3 py-1.5 rounded-lg text-xs font-bold" style="background:${mastered?"var(--good)":"var(--surface)"};color:${mastered?"#fff":"var(--ink-soft)"}">${mastered?"✓ Student-rated secure":"I produced this independently"}</button>
      <span class="text-xs" style="color:var(--muted)">Self-assessed — not verified by the system.</span>
    </div>
  </div>`;
}

function renderPaperResults(s){
  const items=paperState.items;
  const kindLabel=paperState.kind==="test" ? "Test" : "Exam";
  const autoItems=items.filter(it=>it.activity==="recognise"||it.activity==="build");
  const autoCorrect=autoItems.filter(it=>paperState.responses[it.id]?.correct).length;
  const scorePct=autoItems.length? Math.round(autoCorrect/autoItems.length*100) : null;
  const writtenItems=items.filter(it=>it.activity!=="recognise"&&it.activity!=="build");
  const writtenAttempted=writtenItems.filter(it=>paperState.writtenText[it.id]).length;

  const topicRows=paperTopicBreakdown(s);
  const weak=weakItemsFromPaper();
  const weakBySubtopic={};
  weak.forEach(it=>{ const key=it.topic+"|"+it.subtopic; weakBySubtopic[key]=(weakBySubtopic[key]||0)+1; });
  const recommendations=Object.keys(weakBySubtopic).sort((a,b)=>weakBySubtopic[b]-weakBySubtopic[a]).slice(0,4).map(key=>{
    const [tid,subId]=key.split("|");
    const topic=(topicMap[s.id]||[]).find(x=>x.id===tid);
    const sub=topic?.subtopics.find(x=>x[0]===subId);
    return {tid, subId, topicTitle:topic?.title||tid, subTitle:sub?.[1]||subId, count:weakBySubtopic[key]};
  });

  return `<div class="space-y-5">
  <section class="rounded-xl p-6" style="background:linear-gradient(135deg,var(--brand-navy) 0%,var(--brand-navy-deep) 100%);color:#fff">
    <div class="kicker" style="color:var(--gold)">${kindLabel} results — AS ${s.id}${paperState.autoSubmitted?" · time expired":""}</div>
    <div class="flex flex-wrap items-end gap-8 mt-3">
      <div><div class="text-4xl font-bold">${scorePct!==null?scorePct+"%":"—"}</div><div class="text-xs mt-1" style="color:rgba(255,255,255,.8)">Auto-marked score${autoItems.length?` (${autoCorrect}/${autoItems.length} correct)`:""}</div></div>
      <div><div class="text-4xl font-bold">${writtenAttempted}/${writtenItems.length}</div><div class="text-xs mt-1" style="color:rgba(255,255,255,.8)">Written responses attempted</div></div>
      ${paperState.kind==="exam"?`<div><div class="text-4xl font-bold font-mono-num">${formatDuration(Math.round((Date.now()-paperState.startedAt)/1000))}</div><div class="text-xs mt-1" style="color:rgba(255,255,255,.8)">Time taken${paperState.durationSec?` of ${formatDuration(paperState.durationSec)} allowed`:""}</div></div>`:""}
    </div>
    <p class="mt-3 text-sm max-w-2xl" style="color:rgba(255,255,255,.85)">The score above covers only Recognise/Build questions, which can be checked objectively. Written Explain, Apply and calculation responses are shown below with full model answers for you to self-check — rate each one honestly, since the system cannot verify a written answer for you.</p>
  </section>

  <section class="surface p-6">
    <h3 class="text-lg font-bold">Performance by topic</h3>
    <div class="mt-4 space-y-3">${topicRows.map(r=>`<div class="p-3 rounded-lg" style="background:var(--surface-2)">
      <div class="flex justify-between items-center"><b>${r.title}</b>${r.autoTotal?`<span class="font-mono-num text-sm">${r.autoPct}%</span>`:""}</div>
      <div class="text-xs mt-1" style="color:var(--muted)">${r.autoTotal?`${r.autoTotal} auto-marked question${r.autoTotal===1?"":"s"}`:""}${r.autoTotal&&r.writtenTotal?" · ":""}${r.writtenTotal?`${r.writtenAttempted}/${r.writtenTotal} written response${r.writtenTotal===1?"":"s"} attempted`:""}</div>
    </div>`).join("")}</div>
  </section>

  ${recommendations.length?`<section class="surface p-6">
    <h3 class="text-lg font-bold">What to revise next</h3>
    <p class="text-sm mt-1" style="color:var(--muted)">Based on what you got wrong or left blank in this ${kindLabel.toLowerCase()}.</p>
    <div class="mt-4 grid sm:grid-cols-2 gap-3">${recommendations.map(r=>`<button onclick="reviseSubtopic('${s.id}','${r.tid}','${r.subId}')" class="card-hover text-left p-4 surface"><div class="font-bold text-sm">${r.subTitle}</div><div class="text-xs mt-1" style="color:var(--muted)">${r.topicTitle} · ${r.count} question${r.count===1?"":"s"} to revisit</div></button>`).join("")}</div>
  </section>`:`<section class="surface p-6 text-sm" style="color:var(--muted)">No clear weak areas showed up this time — solid work. Try again later with a fresh set of questions to keep checking.</section>`}

  <section class="surface p-6">
    <h3 class="text-lg font-bold">Full breakdown, question by question</h3>
    <div class="mt-4 space-y-4">${items.map((it,i)=>paperReviewCard(it,i)).join("")}</div>
  </section>

  <section class="surface p-6 flex flex-col sm:flex-row items-center justify-between gap-4">
    <div class="text-sm" style="color:var(--muted)">Ready to check the same ground again?</div>
    <div class="flex gap-2 flex-none">
      <button onclick="openHub('${s.id}','practice')" class="btn-outline px-4 py-2.5 text-sm">Back to practice centre</button>
      <button onclick="startPaper('${s.id}','${paperState.kind}')" class="btn-ink px-5 py-2.5 text-sm">New ${kindLabel.toLowerCase()} — different questions →</button>
    </div>
  </section>
  </div>`;
}

  </section>
  <section class="mt-5 surface p-5">
    <div class="kicker text-amber-700">Calc-Count exam routine</div>
    <div class="grid sm:grid-cols-4 gap-3 mt-4">
      ${["Identify the method","Set up the working","Execute the algebra","State the answer in context"].map((x,i)=>`<div class="p-3 rounded-lg" style="background:var(--surface-2)"><div class="text-xs font-bold font-mono-num" style="color:var(--muted)">0${i+1}</div><div class="text-sm font-bold mt-1">${x}</div></div>`).join("")}
    </div>
  </section>
  <section class="mt-5 surface p-5">
    <div class="kicker" style="color:var(--muted)">General exam requirements</div>
    <ul class="scope-list mt-3 text-sm space-y-2" style="color:var(--ink-soft)">
      <li>All three standards are assessed by a printed end-of-year examination.</li>
      <li>An approved scientific or graphics calculator is required — all working must be shown.</li>
      <li>Give numeric answers to an appropriate number of significant figures and always include units.</li>
      <li>Radians are the default angle unit throughout calculus &mdash; switch your calculator mode deliberately whenever a question genuinely uses degrees.</li>
    </ul>
  </section>`;
}

function hubGlossary(s){
  return `<section class="surface p-5 spine" style="--spine:var(--c-${s.colour})">
    <div class="kicker text-${s.colour}-700">AS ${s.id}</div>
    <h2 class="font-bold text-lg mt-1">${s.title} glossary</h2>
    <dl class="mt-4 space-y-3">${(glossary[s.id]||[]).map(([term,def])=>`<div><dt class="font-bold text-sm">${term}</dt><dd class="text-sm mt-0.5" style="color:var(--ink-soft)">${def}</dd></div>`).join("")}</dl>
  </section>`;
}

function hub(){
  const s=current(), sc=examScope[s.id], cov=standardCoverage(s.id);
  const tabs=[["topics","Browse topics"],["practice","Practice centre"],["exam","Exam scope & resources"],["glossary","Glossary"]];
  const body = state.hubTab==="practice" ? hubPractice(s)
    : state.hubTab==="exam" ? hubExam(s)
    : state.hubTab==="glossary" ? hubGlossary(s)
    : hubTopics(s);
  return `<button onclick="goHome()" class="text-sm font-bold mb-5 flex items-center gap-2" style="color:var(--muted)">${icon("back",16)} All standards</button>
  <section class="surface-strong p-6 md:p-7 spine" style="--spine:var(--c-${s.colour})">
    <div class="flex flex-col md:flex-row md:items-start justify-between gap-5">
      <div class="flex items-start gap-4">
        <div class="w-11 h-11 rounded-lg bg-${s.colour}-50 text-${s.colour}-700 flex items-center justify-center flex-none">${icon(s.icon,22)}</div>
        <div>
          <div class="kicker text-${s.colour}-700">AS ${s.id} — ${sc.credits} credits</div>
          <h1 class="text-2xl md:text-3xl font-bold mt-1">${s.title}</h1>
          <p class="mt-2 max-w-2xl text-sm" style="color:var(--muted)">${s.summary}</p>
        </div>
      </div>
      <div class="md:w-44 flex-none">
        <div class="flex justify-between text-xs font-bold" style="color:var(--ink-soft)"><span>Visited</span><span class="font-mono-num">${cov}%</span></div>
        <div class="progress-track mt-2"><div class="progress-fill" style="width:${cov}%"></div></div>
      </div>
    </div>
    <div class="mt-5 flex flex-wrap gap-2">${tabs.map(t=>`<button onclick="setHubTab('${t[0]}')" class="tab-btn${state.hubTab===t[0]?" active":""}">${t[1]}</button>`).join("")}</div>
  </section>
  <div class="mt-5">${body}</div>`;
}

/* =========================================================================
   RENDER: FLOATING REFERENCE PANEL (formulae & rules)
   ========================================================================= */
function referenceData(){
  return Object.values(standards).map(s=>{
    const d=dataSheet[s.id];
    return `<section class="surface p-6 mb-5 spine" style="--spine:var(--c-${s.colour})">
      <div class="kicker text-${s.colour}-700">AS ${s.id} — ${s.title}</div>
      <div class="grid md:grid-cols-2 gap-3 mt-4">
        ${d.equations.map(([eq,note])=>`<div class="p-3 rounded-lg" style="background:var(--surface-2)"><div class="eq">${eq}</div><div class="text-xs mt-2" style="color:var(--muted)">${note}</div></div>`).join("")}
      </div>
      <div class="mt-6">
        <h3 class="font-bold">${d.reference.title}</h3>
        <div class="mt-3 overflow-x-auto"><table class="data-table"><thead><tr>${d.reference.headers.map(h=>`<th>${h}</th>`).join("")}</tr></thead>
        <tbody>${d.reference.rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")}</tbody></table></div>
      </div>
    </section>`;
  }).join("");
}

function floatingWidget(){
  const panelOpen = state.floatOpen==="data";
  return `
  <button onclick="${panelOpen?"closeFloat()":"openFloat('data')"}" class="float-btn" title="Formulae &amp; rules">${icon(panelOpen?"close":"integral",22)}</button>
  ${panelOpen?`<div class="overlay" id="floatOverlay" onclick="closeFloatIfBackdrop(event)">
    <div class="overlay-panel">
      <div class="p-4 border-b flex items-center justify-between" style="border-color:var(--line)">
        <div class="font-bold">Formulae &amp; rules</div>
        <button onclick="closeFloat()" class="p-1.5 rounded-lg" style="color:var(--muted)">${icon("close",18)}</button>
      </div>
      <div class="p-4">${referenceData()}</div>
    </div>
  </div>`:""}`;
}

/* =========================================================================
   ROOT RENDER
   ========================================================================= */
function render(){
 const main = state.view==="home" ? home()
   : state.view==="hub" ? hub()
   : standardPage();

 document.getElementById("app").innerHTML=`
 <header class="masthead sticky top-0 z-40">
   <div class="shell h-16 flex items-center justify-between">
     <button onclick="goHome()" class="flex items-center gap-3">
       <img src="${WHS_LOGO}" alt="Waiheke High School crest" class="whs-crest">
       <div class="text-left"><div class="font-bold text-lg leading-none" style="font-family:var(--font-display);color:#fff">Calc-Count</div><div class="kicker mt-1">Waiheke High School</div></div>
     </button>
     <nav class="flex items-center gap-1">
       <a href="${STUDENT_NCEA_URL}" target="_blank" rel="noopener" title="Open the StudentNCEA hub in a new tab" class="nav-pill px-3 py-2 text-sm font-bold inline-flex items-center gap-1.5" style="color:#fff">StudentNCEA ${icon("externallink",13)}</a>
       <button onclick="openSearch()" title="Search topics and glossary" class="icon-btn p-2.5">${icon("search",16)}</button>
       <button onclick="toggleTheme()" id="theme-toggle-btn" title="Switch light / dark theme" class="icon-btn p-2.5">${icon("theme",16)}</button>
     </nav>
   </div>
 </header>
 <main class="shell py-7 md:py-9 pb-16">${main}</main>
 <footer class="shell pb-8"><div class="hairline pt-5 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 text-xs" style="color:var(--muted)">
   <span>Calc-Count — NCEA Level 3 Calculus — learn accurately, practise actively, explain deeply</span>
   <button onclick="resetProgress()" class="flex items-center gap-1.5 font-semibold" style="color:var(--muted)">${icon("refresh",13)} Reset saved progress</button>
 </div></footer>
 ${floatingWidget()}`;
}

syncTheme();
restorePaperState();
if(paperState){
  // Resume straight into an in-progress (or just-finished, unviewed) Test/Exam
  // attempt after a reload, rather than stranding it behind the home page.
  state.view="standard"; state.standard=paperState.standard; state.stage=paperState.kind;
  state.topic=null; state.subtopic=null;
}
render();
startExamTimerIfNeeded();
</script>
</body>
</html>
