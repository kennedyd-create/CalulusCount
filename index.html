<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calc-Count</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500..900&family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<style>
:root{
  /* Waiheke High School palette — matched to the WHS crest and the
     Money Together house style: navy brand, gold accent, on a cool
     slate-violet paper (Calc-Count's own neutral — ChemDash runs warm
     parchment, PhysicsCircuit runs cool blue-grey; this sits apart from
     both, closer to chalkboard/graph-paper). */
  --paper:#e6e1ea;
  --surface:#faf8fb;
  --surface-2:#d4c9dc;
  --line:#6b5f76;
  --line-strong:#473c52;
  --ink:#191420;
  --ink-soft:#332b3c;
  --muted:#5a4e66;
  --brand-navy:#002066;
  --brand-navy-deep:#00112e;
  --brand-navy-line:#00112e;
  --navy:#002066;
  --navy-soft:#d1e6f6;
  --gold:#c5a059;
  --gold-text:#8b6508;
  --gold-soft:#f5ead2;
  --wine:#8c2415;
  --wine-soft:#f2d7ce;
  --good:#0f6b3f;
  --good-soft:#cdeadb;
  --excellence:#59327b;
  --excellence-soft:#ece1f3;
  /* Per-standard accents — a fresh trio (rose / teal / olive) so
     Calc-Count reads as its own subject rather than reusing ChemDash's
     orange/green/blue or PhysicsCircuit's blue/orange. */
  --mod-complex:#9c3566;--mod-complex-soft:#f6dce7;
  --mod-diff:#0e7a7f;--mod-diff-soft:#d2edee;
  --mod-integ:#5c7a1f;--mod-integ-soft:#e6ecd0;
  --c-complex:var(--mod-complex);--c-diff:var(--mod-diff);--c-integ:var(--mod-integ);
  --shadow:rgba(20,14,26,.24);
  --focus:var(--navy);
  --font-display:'Fraunces',Georgia,'Times New Roman',serif;
  --font-body:'Manrope',-apple-system,'Segoe UI',sans-serif;
  --font-mono:'IBM Plex Mono','SFMono-Regular',Consolas,monospace;
  --shadow-sm:0 2px 0 var(--shadow);
  --shadow-md:0 3px 0 var(--shadow);
  --radius-sm:6px;--radius-md:7px;--radius-lg:8px;
  color-scheme:light dark;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#120f18;--surface:#1c1724;--surface-2:#2a2233;
    --line:#5e5270;--line-strong:#8a7c9c;--ink:#f0ebf4;--ink-soft:#d7cce0;--muted:#a89bb8;
    --navy:#8ec2ec;--navy-soft:#1b2c38;
    --brand-navy:#123a8f;--brand-navy-deep:#05173d;--brand-navy-line:#3d6fe0;
    --gold:#d4b378;--gold-text:#e8c98a;--gold-soft:#2c2410;
    --wine:#ec9280;--wine-soft:#331d16;--good:#8be9b8;--good-soft:#123322;
    --excellence:#bf98e1;--excellence-soft:#2c1f38;
    --mod-complex:#e88ab8;--mod-complex-soft:#3a1a2a;
    --mod-diff:#5cd9dd;--mod-diff-soft:#123334;
    --mod-integ:#b3d15c;--mod-integ-soft:#2c3312;
    --shadow:rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --paper:#120f18;--surface:#1c1724;--surface-2:#2a2233;
  --line:#5e5270;--line-strong:#8a7c9c;--ink:#f0ebf4;--ink-soft:#d7cce0;--muted:#a89bb8;
  --navy:#8ec2ec;--navy-soft:#1b2c38;
  --brand-navy:#123a8f;--brand-navy-deep:#05173d;--brand-navy-line:#3d6fe0;
  --gold:#d4b378;--gold-text:#e8c98a;--gold-soft:#2c2410;
  --wine:#ec9280;--wine-soft:#331d16;--good:#8be9b8;--good-soft:#123322;
  --excellence:#bf98e1;--excellence-soft:#2c1f38;
  --mod-complex:#e88ab8;--mod-complex-soft:#3a1a2a;
  --mod-diff:#5cd9dd;--mod-diff-soft:#123334;
  --mod-integ:#b3d15c;--mod-integ-soft:#2c3312;
  --shadow:rgba(0,0,0,.5);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;
  font-family:var(--font-body);
  background:var(--paper);
  color:var(--ink);
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3{font-family:var(--font-display);font-weight:800;text-wrap:balance;letter-spacing:-.01em}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:4px}
button{font-family:inherit;cursor:pointer;color:inherit}
::selection{background:var(--navy);color:#fff}
.shell{max-width:1180px;margin:0 auto;padding-inline:20px}
.font-mono-num{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.kicker{font-family:var(--font-mono);font-size:.7rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.on-navy .kicker,.masthead .kicker{color:var(--gold)}
.paper-grid{
  background-image:radial-gradient(circle,var(--line) 1px,transparent 1px);
  background-size:20px 20px;
}
.surface{background:var(--surface);border:1.5px solid var(--line);border-radius:var(--radius-md);box-shadow:var(--shadow-sm)}
.surface-strong{background:var(--surface);border:2px solid var(--line);border-radius:var(--radius-lg);box-shadow:var(--shadow-md)}
.spine{border-left:5px solid var(--spine,var(--brand-navy));}
.hairline{border-top:1.5px dashed var(--line)}
.nav-pill{border-radius:6px;transition:background .15s ease,color .15s ease}
.nav-pill:hover{background:rgba(255,255,255,.14)}
.btn-ink{background:var(--brand-navy);color:#fff;border:1.5px solid var(--brand-navy-line);border-radius:6px;font-weight:700;transition:filter .12s ease,transform .12s ease}
.btn-ink:hover{filter:brightness(1.12)}
.btn-ink:active{transform:translateY(1px)}
.btn-outline{background:transparent;border:1.5px solid var(--line);color:var(--ink);border-radius:6px;font-weight:700}
.btn-outline:hover{border-color:var(--navy);color:var(--navy)}
.card-hover{transition:transform .15s ease,box-shadow .15s ease,border-color .15s ease}
.card-hover:hover{transform:translateY(-2px);border-color:var(--navy)}
.progress-track{height:7px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.progress-fill{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--navy),var(--brand-navy-line))}
.answer-lines{background-image:linear-gradient(var(--line) 1px,transparent 1px);background-size:100% 29px;line-height:29px}
.choice{transition:.12s ease}
.choice.correct{background:var(--good-soft);border-color:var(--good)!important;color:var(--ink)}
.choice.wrong{background:var(--wine-soft);border-color:var(--wine)!important;color:var(--ink)}
.breadcrumb{display:flex;align-items:center;gap:.4rem;flex-wrap:wrap;font-size:.8rem;color:var(--muted);font-family:var(--font-mono)}
.breadcrumb button:hover{color:var(--navy)}
.activity-tile{min-height:150px}
.scope-list li{position:relative;padding-left:1.15rem}
.scope-list li::before{content:"–";position:absolute;left:0;color:var(--muted);font-weight:700}
.data-table{width:100%;border-collapse:collapse;font-size:.86rem}
.data-table th{text-align:left;font-family:var(--font-mono);font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:.55rem .7rem;border-bottom:1.5px solid var(--line-strong)}
.data-table td{padding:.55rem .7rem;border-bottom:1px solid var(--line)}
.data-table tr:last-child td{border-bottom:none}
.eq{font-family:var(--font-mono);font-weight:600;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:.65rem .9rem;display:inline-block}
.overlay{position:fixed;inset:0;background:rgba(13,10,4,.6);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:6vh 18px 18px}
.overlay-panel{width:min(760px,96vw);max-height:88vh;overflow:auto;background:var(--surface);border-radius:var(--radius-lg);border:2px solid var(--line);box-shadow:0 4px 0 var(--shadow)}
.float-btn{position:fixed;right:18px;bottom:18px;z-index:90;width:52px;height:52px;border-radius:999px;background:var(--brand-navy);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 0 var(--shadow);border:2px solid rgba(255,255,255,.2);cursor:pointer}
.float-btn:hover{background:var(--brand-navy-deep)}
.float-menu{position:fixed;right:18px;bottom:78px;z-index:90;background:var(--surface);border:2px solid var(--line);border-radius:var(--radius-lg);box-shadow:0 4px 0 var(--shadow);padding:8px;display:flex;flex-direction:column;gap:3px;min-width:210px}
.float-menu button{text-align:left;padding:.6rem .75rem;border-radius:7px;font-size:.85rem;font-weight:700;color:var(--ink-soft);display:flex;align-items:center;gap:.55rem}
.float-menu button:hover{background:var(--surface-2);color:var(--ink)}
.tab-btn{font-weight:700;font-size:.82rem;padding:.55rem .95rem;border-radius:6px;color:var(--muted)}
.tab-btn.active{background:var(--brand-navy);color:#fff}
.confbtn{width:26px;height:26px;border-radius:5px;border:1.5px solid var(--line);font-family:var(--font-mono);font-size:.72rem;font-weight:700;color:var(--muted);background:var(--surface)}
.confbtn.active{background:var(--brand-navy);border-color:var(--brand-navy);color:#fff}
svg.diagram text{font-family:var(--font-mono);fill:var(--ink)}
.masthead{background:linear-gradient(135deg,var(--brand-navy) 0%,var(--brand-navy-deep) 100%);border-bottom:2px solid var(--brand-navy-line)}
.whs-crest{height:40px;width:auto;flex:none;display:block;background:#fff;border-radius:6px;padding:3px 6px}
.icon-btn{background:rgba(255,255,255,.1);border:1.5px solid rgba(255,255,255,.3);border-radius:6px;color:#fff;transition:background .15s ease}
.icon-btn:hover{background:rgba(255,255,255,.2)}
.text-complex-700,.text-complex-600{color:var(--mod-complex)}
.bg-complex-50{background:var(--mod-complex-soft)}
.border-complex-100{border-color:var(--mod-complex-soft)}
.border-complex-200{border-color:var(--mod-complex)}
.text-diff-700,.text-diff-600{color:var(--mod-diff)}
.bg-diff-50{background:var(--mod-diff-soft)}
.border-diff-100{border-color:var(--mod-diff-soft)}
.border-diff-200{border-color:var(--mod-diff)}
.text-integ-700,.text-integ-600{color:var(--mod-integ)}
.bg-integ-50{background:var(--mod-integ-soft)}
.border-integ-100{border-color:var(--mod-integ-soft)}
.border-integ-200{border-color:var(--mod-integ)}
.text-orange-700,.text-amber-700{color:var(--gold-text)}
.bg-amber-50{background:var(--gold-soft)}
.border-amber-200{border-color:var(--gold)}
.text-purple-700,.text-purple-800{color:var(--excellence)}
.bg-purple-50{background:var(--excellence-soft)}
.border-purple-200{border-color:var(--excellence)}
.text-indigo-700{color:var(--navy)}
.bg-indigo-50{background:var(--navy-soft)}
.border-indigo-200{border-color:var(--navy)}
.bg-blue-50{background:var(--navy-soft)}
.border-blue-200{border-color:var(--navy)}
.bg-red-50{background:var(--wine-soft)}
.border-red-200{border-color:var(--wine)}
.text-emerald-600{color:var(--good)}
@media (max-width:640px){.activity-tile{min-height:auto}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}}
</style>
</head>

  "summary":"The algebra of complex numbers, Argand diagrams, polar (cis) form, loci, and De Moivre's theorem for powers and roots.",
  "learn":[
    {"title":"Operations &amp; equality","points":[
      "A complex number z = x + iy has a real part x = Re(z) and an imaginary part y = Im(z), where i&sup2; = &minus;1.",
      "Add, subtract and multiply complex numbers exactly like binomials in x and y, replacing i&sup2; with &minus;1 wherever it appears.",
      "Two complex numbers are equal only when both their real parts are equal AND their imaginary parts are equal &mdash; one complex equation gives you two real equations.",
      "The complex conjugate of z = x + iy is z&#772; = x &minus; iy; a complex number multiplied by its own conjugate always gives a real number: z&middot;z&#772; = x&sup2; + y&sup2;.",
      "To divide by a complex number, multiply the numerator and denominator by the conjugate of the denominator &mdash; this removes i from the denominator.",
      "A polynomial with real coefficients that has a complex root z = a + bi must also have the conjugate root z&#772; = a &minus; bi &mdash; complex roots of real polynomials always come in conjugate pairs.",
      "Use the conjugate-pair fact to find a missing root, or to build a real quadratic factor (x &minus; z)(x &minus; z&#772;) = x&sup2; &minus; 2ax + (a&sup2;+b&sup2;) from one known complex root."
    ]},
    {"title":"Solving quadratic &amp; cubic equations","points":[
      "If b&sup2; &minus; 4ac is negative, the quadratic formula still works &mdash; simplify &radic;(negative) as i&radic;(positive) before substituting.",
      "A cubic with real coefficients has either three real roots, or one real root and one conjugate pair of complex roots &mdash; it can never have exactly two complex roots and no third.",
      "To solve a cubic given one root, use the factor theorem to find a linear factor, divide it out, then solve the remaining quadratic (which may itself have complex roots).",
      "The remainder theorem still applies with complex numbers: substituting a value z into the polynomial P(z) gives remainder 0 if and only if z is a root.",
      "For ax&sup3;+bx&sup2;+cx+d = 0, the sum of all three roots equals &minus;b/a and the product of all three roots equals &minus;d/a &mdash; useful checks once you think you have all the roots.",
      "Always verify a complex solution by substituting it back into the original equation; a single sign slip in an i&sup2; = &minus;1 substitution is easy to make and easy to catch this way."
    ]},
    {"title":"Argand diagrams, modulus &amp; argument","points":[
      "The Argand plane plots z = x + iy as the point (x, y): the real part along the horizontal axis, the imaginary part along the vertical axis.",
      "The modulus |z| = r = &radic;(x&sup2; + y&sup2;) is the distance from the origin to the point &mdash; always a non-negative real number.",
      "The argument, arg z = &theta;, is the angle from the positive real axis to the line joining the origin to z, measured anticlockwise, conventionally given in the range &minus;&pi; &lt; &theta; &le; &pi;.",
      "Find &theta; using the correct quadrant, not just tan&#8315;&sup1;(y/x) on its own &mdash; a calculator's inverse tangent only returns angles in quadrants 1 and 4, so quadrants 2 and 3 need &pi; added or subtracted.",
      "Polar (cis) form writes the same number differently: z = r(cos &theta; + i sin &theta;) = r cis &theta;. Converting form never changes the number, only how it is written.",
      "A locus |z &minus; z&#8321;| = k is a circle of radius k centred at the point z&#8321;; |z &minus; z&#8321;| = |z &minus; z&#8322;| is the perpendicular bisector of the segment joining z&#8321; and z&#8322;.",
      "arg(z &minus; z&#8321;) = &theta; (a fixed angle) describes a ray starting at z&#8321;, not a full line &mdash; state clearly whether a ray or the whole line through the point is intended."
    ]},
    {"title":"De Moivre's theorem","points":[
      "De Moivre's theorem: (r cis &theta;)&#8319; = r&#8319; cis(n&theta;) &mdash; raising a complex number to a power multiplies the argument by n and raises the modulus to the power n.",
      "To multiply two complex numbers in polar form, multiply the moduli and add the arguments; to divide, divide the moduli and subtract the arguments.",
      "To find all n distinct nth roots of z = r cis &theta;, use r<sup>1/n</sup> cis[(&theta; + 2k&pi;)/n] for k = 0, 1, 2, &hellip;, n&minus;1 &mdash; each value of k up to n&minus;1 gives a genuinely different root.",
      "The n roots of a complex number are always evenly spaced around a circle of radius r<sup>1/n</sup>, each separated from the next by an angle of 2&pi;/n.",
      "The nth roots of unity (solutions of z&#8319; = 1) always include z = 1 itself; the others are evenly spaced points on the unit circle around it.",
      "Convert to polar form before applying De Moivre's theorem &mdash; expanding (a + bi)&#8319; directly by hand for n &ge; 3 is slow and far more error-prone than r cis &theta; raised to the power n."

    {"id":"91577-argand-plane-rec-01","standard":"91577","topic":"argand","subtopic":"argand-plane","type":"gap","prompt":"On an Argand diagram, the point for z = &minus;3 + 4i lies in quadrant ____.","options":["1 (top right)","2 (top left)","3 (bottom left)","4 (bottom right)"],"answer":1,"why":"Real part &minus;3 (left of origin), imaginary part +4 (above origin) places the point in the top-left quadrant."},
    {"id":"91577-mod-arg-rec-01","standard":"91577","topic":"argand","subtopic":"mod-arg","type":"gap","prompt":"For z = 3 + 4i, |z| = ____.","options":["7","5","25","1"],"answer":1,"why":"|z| = &radic;(3&sup2; + 4&sup2;) = &radic;(9+16) = &radic;25 = 5."},
    {"id":"91577-polar-conversion-rec-01","standard":"91577","topic":"argand","subtopic":"polar-conversion","type":"match","prompt":"Match each rectangular form to its polar (cis) form.","pairs":[["1 + i","&radic;2 cis(&pi;/4)"],["&minus;1 + 0i","1 cis(&pi;)"],["0 &minus; 2i","2 cis(&minus;&pi;/2)"]]},
    {"id":"91577-loci-rec-01","standard":"91577","topic":"argand","subtopic":"loci","type":"choice","prompt":"What shape is described by |z &minus; (2+3i)| = 5?","options":["A straight line","A circle of radius 5 centred at (2,3)","A circle of radius 25 centred at the origin","A ray from (2,3)"],"answer":1,"why":"|z &minus; z&#8321;| = k is always a circle of radius k centred at the point z&#8321;; here z&#8321; = 2+3i and k = 5."},
    {"id":"91577-powers-rec-01","standard":"91577","topic":"demoivre","subtopic":"powers","type":"gap","prompt":"Using De Moivre's theorem, (2 cis(&pi;/6))&sup3; = ____.","options":["6 cis(&pi;/2)","8 cis(&pi;/2)","2 cis(&pi;/2)","8 cis(&pi;/6)"],"answer":1,"why":"Raise the modulus to the power 3 (2&sup3;=8) and multiply the argument by 3 (&pi;/6 &times; 3 = &pi;/2), giving 8 cis(&pi;/2)."},
    {"id":"91577-multiply-divide-polar-rec-01","standard":"91577","topic":"demoivre","subtopic":"multiply-divide-polar","type":"gap","prompt":"(3 cis(&pi;/5)) &times; (2 cis(&pi;/10)) = ____.","options":["5 cis(&pi;/2)","6 cis(3&pi;/10)","6 cis(&pi;/50)","5 cis(3&pi;/10)"],"answer":1,"why":"Multiply moduli (3&times;2=6) and add arguments (&pi;/5 + &pi;/10 = 2&pi;/10 + &pi;/10 = 3&pi;/10)."},
    {"id":"91577-nth-roots-rec-01","standard":"91577","topic":"demoivre","subtopic":"nth-roots","type":"choice","prompt":"How many distinct complex solutions does z&#8308; = 16 cis(&pi;) have?","options":["1","2","4","16"],"answer":2,"why":"An equation z&#8319; = (non-zero complex number) always has exactly n distinct complex roots, here n = 4."},
    {"id":"91577-roots-unity-rec-01","standard":"91577","topic":"demoivre","subtopic":"roots-unity","type":"gap","prompt":"The n roots of z&#8319; = 1 are always evenly spaced around a circle of radius ____.","options":["n","1/n","1","0"],"answer":2,"why":"Since |1| = 1, every nth root of unity has modulus 1<sup>1/n</sup> = 1, so all roots lie on the unit circle."}

  "build":[
    {"id":"91577-operations-bld-01","standard":"91577","topic":"algebra","subtopic":"operations","stem":"To divide by a complex denominator leads to multiplying top and bottom by its conjugate leads to ____.","options":["a real number appearing in the denominator","the numerator becoming zero","the fraction becoming undefined","i disappearing from the numerator too"],"answer":0,"why":"z&middot;z&#772; = x&sup2;+y&sup2; is always real, which is exactly why multiplying by the conjugate clears i from the denominator."},
    {"id":"91577-conjugates-bld-01","standard":"91577","topic":"algebra","subtopic":"conjugates","stem":"A real-coefficient cubic has complex root 1 &minus; 2i leads to 1 + 2i must also be a root leads to ____.","options":["the cubic has three real roots only","(z &minus; (1&minus;2i))(z &minus; (1+2i)) is a real quadratic factor","the cubic cannot be factorised","the cubic has no real roots at all"],"answer":1,"why":"Multiplying a complex root by its conjugate pair always gives a quadratic factor with real coefficients, which can then be divided out of the cubic."},
    {"id":"91577-quad-cubic-bld-01","standard":"91577","topic":"algebra","subtopic":"quad-cubic","stem":"The discriminant b&sup2;&minus;4ac of a quadratic is negative leads to &radic;(b&sup2;&minus;4ac) is not a real number leads to ____.","options":["the quadratic has no solutions at all","the two roots form a complex conjugate pair","the quadratic has one repeated real root","the quadratic must be factorised differently"],"answer":1,"why":"A negative discriminant gives &plusmn;i&radic;|b&sup2;&minus;4ac| in the quadratic formula, producing two complex roots that are conjugates of each other."},
    {"id":"91577-polar-conversion-bld-01","standard":"91577","topic":"argand","subtopic":"polar-conversion","stem":"To convert x + iy to polar form leads to calculate r = &radic;(x&sup2;+y&sup2;) and find &theta; in the correct quadrant leads to ____.","options":["z = r cis &theta;, the same number written differently","a completely new complex number","the conjugate of z","the reciprocal of z"],"answer":0,"why":"Polar form is not a new number &mdash; r cis &theta; represents exactly the same point on the Argand plane as x + iy."},
    {"id":"91577-mod-arg-bld-01","standard":"91577","topic":"argand","subtopic":"mod-arg","stem":"z lies in the third quadrant (negative real, negative imaginary part) leads to a calculator's tan&#8315;&sup1;(y/x) returns a first-quadrant angle leads to ____.","options":["that angle is already the correct argument","&pi; (or 180&deg;) must be subtracted from that angle to land in the third quadrant","the argument cannot be found","2&pi; must be added directly to the calculator's answer with no other change"],"answer":1,"why":"Because tan is periodic every &pi;, a calculator's principal value needs an adjustment of &plusmn;&pi; to land in the correct quadrant for a third-quadrant point."},
    {"id":"91577-powers-bld-01","standard":"91577","topic":"demoivre","subtopic":"powers","stem":"Converting z to polar form r cis &theta; before raising it to a power leads to applying De Moivre's theorem leads to ____.","options":["rⁿ cis(n&theta;), found without expanding brackets by hand","the same result as binomial expansion, but always slower to compute for large n","an answer that must be converted back before it is valid","a result only valid for n = 2"],"answer":0,"why":"De Moivre's theorem converts a power into simple arithmetic on r and &theta;, avoiding a lengthy binomial expansion of (a+bi)&#8319;."},
    {"id":"91577-nth-roots-bld-01","standard":"91577","topic":"demoivre","subtopic":"nth-roots","stem":"Solving zⁿ = r cis&theta; leads to using z = r<sup>1/n</sup> cis[(&theta;+2k&pi;)/n] for k = 0 up to n&minus;1 leads to ____.","options":["exactly one root is found","exactly n distinct roots are found, evenly spaced around a circle","infinitely many roots are found","the roots are all identical"],"answer":1,"why":"Each value of k from 0 to n&minus;1 gives a genuinely different angle (and hence a different root); k=n would repeat k=0's angle exactly."},
    {"id":"91577-roots-unity-bld-01","standard":"91577","topic":"demoivre","subtopic":"roots-unity","stem":"z&#8319; = 1 is rewritten as z&#8319; = 1 cis(0 + 2k&pi;) leads to applying the nth-root formula leads to ____.","options":["all n roots have modulus 1 and are evenly spaced by 2&pi;/n around the origin","only z = 1 is a solution","the roots have modulus n","the roots are not evenly spaced"],"answer":0,"why":"Since |1|=1, every root has modulus 1<sup>1/n</sup>=1; the n roots are spaced 2&pi;/n apart starting from z=1 itself (k=0)."}

  "explain":[
    {"id":"91577-conjugates-exp-01","standard":"91577","topic":"algebra","subtopic":"conjugates","question":"Explain why a cubic equation with real coefficients cannot have exactly two complex roots and one real root missing &mdash; i.e. why complex roots must come in conjugate pairs.","criteria":["complex roots come from a negative discriminant step","conjugate root property of real-coefficient polynomials","a cubic has exactly 3 roots total","pairing forces the third root to be real"],"merit":"Because the polynomial has real coefficients, any complex root z must have its conjugate z&#772; also as a root. A cubic has exactly three roots in total, so if two of them form a complex conjugate pair, the third root cannot also be complex without breaking the pairing rule, so it must be real.","excellence":"For a polynomial with entirely real coefficients, complex roots are guaranteed to occur in conjugate pairs, because taking the conjugate of the whole equation P(z)=0 leaves the (real) coefficients unchanged but conjugates every root. A cubic has exactly three roots counted with multiplicity. If one root is complex, its conjugate must also be a root, accounting for two of the three roots as a matched pair. The remaining single root has no partner to pair with, so it cannot be complex (an unpaired complex root would violate the conjugate-pair rule) &mdash; it must therefore be real. This is why a real cubic's roots are always either three real roots, or one real root plus one conjugate pair, never two complex roots alone."},
    {"id":"91577-quad-cubic-exp-01","standard":"91577","topic":"algebra","subtopic":"quad-cubic","question":"Given that z = 1 + i is a root of P(z) = z&sup3; &minus; 3z&sup2; + 4z &minus; 2, explain how to find all the remaining roots.","criteria":["1&minus;i is also a root by the conjugate pair rule","form the real quadratic factor from the pair","divide P(z) by this quadratic","solve the resulting linear factor for the third root"],"merit":"Since P has real coefficients, 1&minus;i must also be a root. Multiplying (z&minus;(1+i))(z&minus;(1&minus;i)) gives the real quadratic factor z&sup2;&minus;2z+2. Dividing P(z) by this quadratic gives a linear factor, which is solved for the third, real root.","excellence":"Because P(z) has entirely real coefficients, the complex root 1+i guarantees that its conjugate, 1&minus;i, is also a root. Multiplying the two corresponding factors, (z&minus;(1+i))(z&minus;(1&minus;i)), expands to z&sup2; &minus; 2z + (1&sup2;+1&sup2;) = z&sup2; &minus; 2z + 2, a quadratic factor with entirely real coefficients. Dividing the original cubic P(z) by this quadratic factor (by long division or inspection) leaves a linear factor in z, whose root is the third, real root of the cubic. This method turns a cubic with an unfamiliar complex root into ordinary polynomial division, using only the conjugate-pair property to construct the correct real quadratic to divide by."},
    {"id":"91577-loci-exp-01","standard":"91577","topic":"argand","subtopic":"loci","question":"Explain what shape is described by |z &minus; 3| = |z + 3i|, and how to justify it.","criteria":["distance from z to 3 equals distance from z to &minus;3i","this is the definition of a perpendicular bisector","identify the two fixed points","state the resulting locus is a straight line"],"merit":"|z &minus; 3| is the distance from z to the point 3 (i.e. (3,0)), and |z &minus; (&minus;3i)| is the distance from z to the point &minus;3i (i.e. (0,&minus;3)). Setting these distances equal means z is equidistant from both fixed points, which is exactly the definition of the perpendicular bisector of the segment joining them &mdash; so the locus is a straight line.","excellence":"The expression |z &minus; 3| represents the distance on the Argand plane between the variable point z and the fixed point (3, 0), while |z &minus; (&minus;3i)| represents the distance between z and the fixed point (0, &minus;3). The equation |z &minus; 3| = |z + 3i| states that these two distances are always equal, which by definition describes the set of all points equidistant from (3,0) and (0,&minus;3) &mdash; the perpendicular bisector of the line segment joining those two points. This locus is therefore a straight line, and its equation could be found explicitly by substituting z = x+iy into both sides and squaring to remove the moduli, then simplifying to a linear equation in x and y."},
    {"id":"91577-nth-roots-exp-01","standard":"91577","topic":"demoivre","subtopic":"nth-roots","question":"Explain why z&#8308; = &minus;1 has 4 distinct complex solutions, and describe their geometric arrangement.","criteria":["rewrite &minus;1 in polar form with general angle","apply the nth root formula for n=4","identify 4 distinct values of k","describe the evenly spaced arrangement on a circle"],"merit":"Writing &minus;1 as 1cis(&pi;+2k&pi;), the four fourth roots are 1cis[(&pi;+2k&pi;)/4] for k=0,1,2,3, giving four distinct angles. Since all four roots have modulus 1, they lie on the unit circle, evenly spaced &pi;/2 (90&deg;) apart.","excellence":"Rewriting &minus;1 in polar form as 1&middot;cis(&pi; + 2k&pi;), where k is any integer, allows De Moivre's nth-root formula to be applied: the fourth roots are z = 1<sup>1/4</sup> cis[(&pi;+2k&pi;)/4], evaluated for k = 0, 1, 2, 3. Each of these four values of k produces a genuinely distinct angle, because they differ by increments of 2&pi;/4 = &pi;/2 within a full 2&pi; rotation; using k=4 would simply repeat the angle from k=0. All four roots share the same modulus, 1<sup>1/4</sup> = 1, so every root lies exactly on the unit circle. Because their arguments are evenly spaced by &pi;/2 radians, the four points form the vertices of a square inscribed in the unit circle, centred on the origin &mdash; the general geometric pattern for the n distinct nth roots of any non-zero complex number."},
    {"id":"91577-mod-arg-exp-01","standard":"91577","topic":"argand","subtopic":"mod-arg","question":"Explain why simply computing tan&#8315;&sup1;(y/x) on a calculator is not always sufficient to find arg(z) correctly.","criteria":["tan has a period of &pi;, not 2&pi;","calculator inverse tan only returns values in a restricted range","quadrant of z must be checked separately","correction of &plusmn;&pi; needed outside quadrants 1 and 4"],"merit":"Because tan repeats every &pi; radians, a calculator's tan&#8315;&sup1; function always returns a value between &minus;&pi;/2 and &pi;/2, which only correctly represents arguments in quadrants 1 and 4. For a point in quadrant 2 or 3, the calculator's answer must be adjusted by adding or subtracting &pi; to land in the correct quadrant.","excellence":"The inverse tangent function is restricted by its own definition to return values only in the range (&minus;&pi;/2, &pi;/2), because tan(&theta;) itself repeats every &pi; radians and is therefore not one-to-one over a full rotation. This means tan&#8315;&sup1;(y/x) alone cannot distinguish between a point in quadrant 1 and its diagonally-opposite counterpart in quadrant 3, since both give the same ratio y/x and hence the same raw calculator output. To find the true argument, the actual signs of x and y (i.e. which quadrant z lies in) must be checked separately, and &plusmn;&pi; added to the calculator's raw answer whenever z lies in quadrant 2 or quadrant 3, so that the final argument correctly reflects the true direction of the point from the origin."},
    {"id":"91577-operations-exp-01","standard":"91577","topic":"algebra","subtopic":"operations","question":"Explain why z&middot;z&#772; is always a non-negative real number for any complex number z.","criteria":["write z=x+iy and z&#772;=x&minus;iy","expand the product as a difference of squares","substitute i&sup2;=&minus;1","recognise x&sup2;+y&sup2; is always &ge;0"],"merit":"For z=x+iy, z&#772;=x&minus;iy, so z&middot;z&#772;=(x+iy)(x&minus;iy)=x&sup2;&minus;(iy)&sup2;=x&sup2;&minus;i&sup2;y&sup2;=x&sup2;+y&sup2;, which is a sum of two squares and therefore always real and non-negative.","excellence":"Writing z = x+iy gives its conjugate as z&#772; = x&minus;iy. Multiplying these two factors is structurally a difference-of-squares expansion: (x+iy)(x&minus;iy) = x&sup2; &minus; (iy)&sup2;. Substituting i&sup2; = &minus;1 turns &minus;(iy)&sup2; into &minus;i&sup2;y&sup2; = &minus;(&minus;1)y&sup2; = +y&sup2;, so the product simplifies fully to x&sup2;+y&sup2;. Because x and y are both real numbers, their squares x&sup2; and y&sup2; are individually non-negative, and the sum of two non-negative numbers is itself non-negative. This is precisely why z&middot;z&#772; = |z|&sup2; is always a non-negative real number, and it is the reason multiplying by the conjugate is the standard technique for clearing i from a complex denominator."},
    {"id":"91577-multiply-divide-polar-exp-01","standard":"91577","topic":"demoivre","subtopic":"multiply-divide-polar","question":"Explain, using the compound angle formulae, why multiplying two complex numbers in polar form multiplies their moduli and adds their arguments.","criteria":["expand (r1cis&theta;1)(r2cis&theta;2) directly","apply cos and sin compound angle identities","collect terms into cis(&theta;1+&theta;2) form","state the resulting rule for moduli and arguments"],"merit":"Expanding (r1cis&theta;1)(r2cis&theta;2) = r1r2(cos&theta;1+isin&theta;1)(cos&theta;2+isin&theta;2), then using the compound angle formulae for cos(A+B) and sin(A+B), regroups the expansion into r1r2 cis(&theta;1+&theta;2) &mdash; so the moduli multiply and the arguments add.","excellence":"Writing both numbers in polar form and multiplying gives r1r2(cos&theta;1+isin&theta;1)(cos&theta;2+isin&theta;2). Expanding this product term by term produces r1r2[(cos&theta;1cos&theta;2 &minus; sin&theta;1sin&theta;2) + i(sin&theta;1cos&theta;2 + cos&theta;1sin&theta;2)], using i&sup2;=&minus;1 on the sin&theta;1sin&theta;2 term. The real part, cos&theta;1cos&theta;2 &minus; sin&theta;1sin&theta;2, is exactly the compound angle identity for cos(&theta;1+&theta;2), and the imaginary part, sin&theta;1cos&theta;2 + cos&theta;1sin&theta;2, is exactly the identity for sin(&theta;1+&theta;2). Substituting these identities back in gives r1r2[cos(&theta;1+&theta;2) + isin(&theta;1+&theta;2)] = r1r2 cis(&theta;1+&theta;2). This confirms directly from the compound angle formulae, not just by pattern-matching, that multiplying complex numbers in polar form multiplies the moduli and adds the arguments."}
  ],
  "apply":[
    {"id":"91577-quad-cubic-app-01","standard":"91577","topic":"algebra","subtopic":"quad-cubic","question":"A cubic P(z) has real coefficients and roots 2, 3+i and one other root. State the third root and explain how you know.","answer":"The third root must be 3&minus;i, the conjugate of 3+i. Since P has real coefficients, any complex root's conjugate must also be a root; 3+i and 3&minus;i form the required conjugate pair, leaving 2 as the one real root."},
    {"id":"91577-mod-arg-app-01","standard":"91577","topic":"argand","subtopic":"mod-arg","question":"An engineer represents an AC signal as z = 5 cis(2&pi;/3). Interpret |z| and arg(z) in terms of the signal's magnitude and phase.","answer":"|z| = 5 represents the signal's amplitude (magnitude), while arg(z) = 2&pi;/3 represents its phase angle relative to a reference signal, i.e. how far the signal is shifted in its cycle."},
    {"id":"91577-loci-app-01","standard":"91577","topic":"argand","subtopic":"loci","question":"A radar station is at the origin of an Argand diagram. A plane's position z satisfies |z| = 40 (in km). Describe the set of possible positions, and explain what changing this to |z| &le; 40 would mean.","answer":"|z| = 40 describes a circle of radius 40 km centred on the radar station &mdash; every possible position of the plane exactly 40 km away. Changing to |z| &le; 40 would describe every point inside or on that circle, i.e. anywhere within 40 km of the station, not just exactly on the boundary."},
    {"id":"91577-nth-roots-app-01","standard":"91577","topic":"demoivre","subtopic":"nth-roots","question":"Without fully solving it, predict how many distinct complex solutions z&#8309; = 3+4i has, and describe how they would be arranged on an Argand diagram.","answer":"There are exactly 5 distinct complex solutions, since any equation z&#8319;=(non-zero complex number) has exactly n roots. They would be arranged as 5 points evenly spaced by 2&pi;/5 around a circle centred at the origin, with radius equal to |3+4i|<sup>1/5</sup> = 5<sup>1/5</sup>."},
    {"id":"91577-conjugates-app-01","standard":"91577","topic":"algebra","subtopic":"conjugates","question":"A student claims that (2+3i) + (2&minus;3i) must be complex because both terms contain i. Evaluate this claim.","answer":"The claim is incorrect. (2+3i)+(2&minus;3i) = 4+0i = 4, a real number. Adding a complex number to its own conjugate always cancels the imaginary parts (they are exact opposites), leaving twice the real part &mdash; a purely real result, even though the individual terms are complex."},
    {"id":"91577-roots-unity-app-01","standard":"91577","topic":"demoivre","subtopic":"roots-unity","question":"Explain why the 6th roots of unity, plotted on an Argand diagram, form a regular hexagon, and state one of the roots other than 1.","answer":"The 6 sixth roots of unity all have modulus 1 (since |1|=1) and are evenly spaced by 2&pi;/6 = 60&deg; around the unit circle, starting from z=1. Six points evenly spaced by equal angles around a circle form the vertices of a regular hexagon. One other root is cis(&pi;/3) = cos60&deg;+isin60&deg; = &frac12;+(&radic;3/2)i."}
  ],
  "worked":[
    {"id":"91577-quad-cubic-wrk-01","standard":"91577","topic":"algebra","subtopic":"quad-cubic","title":"Solving a cubic given one complex root","question":"Given that 2i is a root of P(z) = z&sup3; &minus; 3z&sup2; + 4z &minus; 12, find all three roots.","plan":["State the conjugate root that must also exist.","Form the real quadratic factor from the conjugate pair.","Divide P(z) by this quadratic to find the remaining factor.","Solve the remaining linear factor for the third root."],"answer":"Since P has real coefficients, &minus;2i must also be a root. The quadratic factor from this pair is (z&minus;2i)(z+2i) = z&sup2;+4. Dividing z&sup3;&minus;3z&sup2;+4z&minus;12 by z&sup2;+4 gives z&minus;3 (check: (z&sup2;+4)(z&minus;3) = z&sup3;&minus;3z&sup2;+4z&minus;12 &check;). So the third root is z=3. The three roots are 2i, &minus;2i and 3.","why":"This response identifies the conjugate pair immediately, converts it into a usable real quadratic factor, and completes the division cleanly &mdash; a fully connected chain of reasoning rather than guessing roots by trial.","trap":"Do not try to solve a cubic with a complex root by trial-and-error substitution of real numbers &mdash; use the conjugate pair to build a quadratic factor and divide it out systematically."},
    {"id":"91577-nth-roots-wrk-01","standard":"91577","topic":"demoivre","subtopic":"nth-roots","title":"Finding the cube roots of a complex number","question":"Find all three cube roots of z = 8 cis(&pi;/3), giving answers in polar form.","plan":["Confirm z is already in polar form.","Apply the nth root formula with n=3.","Substitute k=0,1,2 to get three distinct angles.","Present all three roots clearly."],"answer":"Using w = 8<sup>1/3</sup> cis[(&pi;/3 + 2k&pi;)/3] for k=0,1,2: modulus = 8<sup>1/3</sup> = 2 for every root. For k=0: angle = &pi;/9, so w&#8320; = 2cis(&pi;/9). For k=1: angle = (&pi;/3+2&pi;)/3 = 7&pi;/9, so w&#8321; = 2cis(7&pi;/9). For k=2: angle = (&pi;/3+4&pi;)/3 = 13&pi;/9, so w&#8322; = 2cis(13&pi;/9).","why":"This is Excellence-targeted because it shows the general nth-root formula being applied methodically across every required value of k, rather than finding just one root and stopping.","trap":"Do not stop after finding one root &mdash; the question asks for all three, and forgetting the +2k&pi; term (which generates the other roots) is one of the most common errors here."},
    {"id":"91577-loci-wrk-01","standard":"91577","topic":"argand","subtopic":"loci","title":"Finding the Cartesian equation of a locus","question":"Find the Cartesian equation of the locus |z &minus; 4| = |z &minus; 2i|, and describe it geometrically.","plan":["Let z = x+iy.","Write both sides as distances and square them to remove the moduli.","Expand and simplify to a linear equation in x and y.","Interpret the result geometrically."],"answer":"Let z=x+iy. |z&minus;4| = &radic;[(x&minus;4)&sup2;+y&sup2;] and |z&minus;2i| = &radic;[x&sup2;+(y&minus;2)&sup2;]. Squaring both sides: (x&minus;4)&sup2;+y&sup2; = x&sup2;+(y&minus;2)&sup2;. Expanding: x&sup2;&minus;8x+16+y&sup2; = x&sup2;+y&sup2;&minus;4y+4. Simplifying: &minus;8x+16 = &minus;4y+4, so 4y = 8x&minus;12, giving y = 2x&minus;3. This is the perpendicular bisector of the segment joining (4,0) and (0,2).","why":"This connects the geometric meaning of the locus to an explicit algebraic derivation, finishing with the correct geometric interpretation &mdash; exactly the kind of complete reasoning Excellence responses need.","trap":"A very common error is forgetting to square both sides before expanding, which leaves an unmanageable equation full of square roots; square first, then expand."},
    {"id":"91577-conjugates-wrk-01","standard":"91577","topic":"algebra","subtopic":"conjugates","title":"Dividing complex numbers using the conjugate","question":"Simplify (5+2i)/(3&minus;i) into the form x+iy.","plan":["Identify the conjugate of the denominator.","Multiply numerator and denominator by this conjugate.","Expand and simplify using i&sup2;=&minus;1.","Write the final answer in x+iy form."],"answer":"Multiply top and bottom by 3+i: [(5+2i)(3+i)] / [(3&minus;i)(3+i)]. Denominator: 9&minus;i&sup2;=9+1=10. Numerator: 15+5i+6i+2i&sup2; = 15+11i&minus;2 = 13+11i. So the result is (13+11i)/10 = 1.3 + 1.1i.","why":"Full expansion of both numerator and denominator, with the i&sup2; substitution shown explicitly, demonstrates the reliable algebraic process Merit and Excellence responses both need here.","trap":"Multiplying only the denominator by its conjugate (and forgetting to also multiply the numerator) changes the value of the fraction &mdash; both must be multiplied by the same factor."},
    {"id":"91577-multiply-divide-polar-wrk-01","standard":"91577","topic":"demoivre","subtopic":"multiply-divide-polar","title":"Using polar form to simplify a power and a quotient together","question":"Simplify (2cis(&pi;/4))&sup3; &divide; (4cis(&pi;/6)), giving your answer in polar form with a positive argument less than 2&pi;.","plan":["Apply De Moivre's theorem to the numerator's power first.","Then divide moduli and subtract arguments.","Simplify the resulting modulus and argument.","Adjust the argument into the required range if necessary."],"answer":"First, (2cis(&pi;/4))&sup3; = 2&sup3;cis(3&pi;/4) = 8cis(3&pi;/4). Now divide by 4cis(&pi;/6): modulus 8&divide;4=2; argument 3&pi;/4 &minus; &pi;/6 = 9&pi;/12&minus;2&pi;/12 = 7&pi;/12. The result is 2cis(7&pi;/12), and 7&pi;/12 is already between 0 and 2&pi;, so no adjustment is needed.","why":"Sequencing De Moivre's theorem before the division, rather than attempting both operations at once, keeps each step clean and is exactly the kind of strategic ordering that distinguishes a fluent Excellence response.","trap":"Applying De Moivre's theorem to the whole expression (including the denominator) at the same time as the division often causes sign or arithmetic errors &mdash; work through the power first, then divide."}
  ],
  "review":[
    "Can I add, subtract, multiply and divide complex numbers confidently, including using the conjugate to divide?",
    "Do I know that complex roots of a real-coefficient polynomial always come in conjugate pairs, and can I use this to find a missing root?",

"91578": {
  "id":"91578","title":"Differentiation","icon":"tangent","colour":"diff",
  "summary":"Derivative rules for standard functions, the chain/product/quotient rules, tangents and normals, related rates, parametric differentiation, and curve analysis including optimisation.",
  "learn":[
    {"title":"Standard derivatives &amp; the chain rule","points":[
      "d/dx(x&#8319;) = nx&#8319;&#8315;&sup1; for any real n &mdash; this power rule underlies almost every other derivative.",
      "d/dx(e&#8339;) = e&#8339;; the exponential function is its own derivative. d/dx(ln x) = 1/x for x &gt; 0.",
      "d/dx(sin x) = cos x and d/dx(cos x) = &minus;sin x, always assuming x is measured in radians &mdash; the standard also covers d/dx(tan x) = sec&sup2;x and the reciprocal trig derivatives.",
      "The chain rule: if y = f(u) and u = g(x), then dy/dx = (dy/du)&middot;(du/dx). Recognise a chain-rule situation whenever one function is 'inside' another, like sin(3x&sup2;) or e<sup>x&sup2;</sup>.",
      "A quick way to apply the chain rule: differentiate the outside function first (leaving the inside untouched), then multiply by the derivative of the inside function.",
      "Composite functions can be nested more than once &mdash; e.g. ln(sin(2x)) needs the chain rule applied twice, working from the outside in.",
      "logarithmic derivatives on this standard are restricted to base e (natural log) only &mdash; you will not need d/dx(log&#8342;x) for a general base b."
    ]},
    {"title":"Product &amp; quotient rules","points":[
      "Product rule: if y = uv, then dy/dx = v(du/dx) + u(dv/dx) &mdash; 'derivative of the first times the second, plus the first times the derivative of the second'.",
      "Quotient rule: if y = u/v, then dy/dx = [v(du/dx) &minus; u(dv/dx)] / v&sup2; &mdash; the order in the numerator matters, and the denominator is always squared.",
      "Recognise when a product or quotient rule is genuinely needed: if a function is a product or ratio of two more complicated pieces (not just a constant times a function), you need these rules rather than the simple power rule.",
      "The chain rule is often required inside a product or quotient rule step, whenever du/dx or dv/dx itself requires the chain rule &mdash; e.g. differentiating x&sup2;sin(3x) needs the product rule with a chain-ruled derivative for sin(3x).",
      "Fully simplifying an answer (factorising out common terms) is often expected, unless the question explicitly says no simplification is required &mdash; read the instruction carefully either way.",
      "A common way to simplify a quotient-rule derivative is to factor the numerator, cancelling common factors with part of v&sup2; where possible."
    ]},
    {"title":"Tangents, normals &amp; rates of change","points":[
      "The gradient of the tangent to y = f(x) at x = a is f&prime;(a); the tangent line equation is y &minus; f(a) = f&prime;(a)(x &minus; a).",
      "The normal at the same point is perpendicular to the tangent, so its gradient is the negative reciprocal of f&prime;(a): m<sub>normal</sub> = &minus;1/f&prime;(a) (provided f&prime;(a) &ne; 0).",
      "dy/dx represents an instantaneous rate of change &mdash; how fast y is changing with respect to x at one particular moment, not an average rate over an interval.",
      "In related rates problems, differentiate an equation connecting two (or more) changing quantities with respect to time, using the chain rule to introduce each rate (dx/dt, dy/dt, etc).",
      "Set up related-rates problems by first writing a clear equation connecting the relevant quantities (often from geometry &mdash; area, volume, Pythagoras), then differentiate that equation with respect to time before substituting known values.",
      "For a parametric curve x = f(t), y = g(t), dy/dx = (dy/dt) &divide; (dx/dt); the second derivative needs the chain rule again: d&sup2;y/dx&sup2; = [d/dt(dy/dx)] &divide; (dx/dt)."
    ]},
    {"title":"Curve analysis &amp; optimisation","points":[
      "Stationary points occur where f&prime;(x) = 0; classify them using the sign of f&prime;(x) either side, or using the second derivative: f&Prime;(x) &gt; 0 means a local minimum, f&Prime;(x) &lt; 0 means a local maximum.",
      "A point of inflection is where concavity changes &mdash; f&Prime;(x) changes sign (from positive to negative or vice versa) as x passes through that point; f&Prime;(x)=0 alone is not sufficient, since the sign must actually change.",
      "Concave up means f&Prime;(x) &gt; 0 (the curve bends upward, like a smile); concave down means f&Prime;(x) &lt; 0 (the curve bends downward, like a frown).",
      "Optimisation problems ask for a maximum or minimum of some quantity: write it as a function of one variable (using a constraint to eliminate a second variable if needed), differentiate, set the derivative to zero, and justify the type of stationary point found.",
      "Always interpret your optimisation answer in the context of the question &mdash; state what the maximum or minimum value actually represents, with correct units, not just the bare number.",
      "A function's graph properties include continuity (no breaks or jumps), differentiability (a well-defined tangent everywhere, i.e. no sharp corners or vertical tangents), and the existence of limits as x approaches a value or infinity."
    ]}
  ],

    {"id":"91578-standard-derivs-rec-01","standard":"91578","topic":"rules","subtopic":"standard-derivs","type":"gap","prompt":"d/dx(x&#8309;) = ____.","options":["4x&#8309;","5x&#8308;","5x&#8309;","x&#8308;"],"answer":1,"why":"Using the power rule, d/dx(x&#8319;)=nx&#8319;&#8315;&sup1;, so n=5 gives 5x&#8308;."},
    {"id":"91578-standard-derivs-rec-02","standard":"91578","topic":"rules","subtopic":"standard-derivs","type":"match","prompt":"Match each function to its derivative.","pairs":[["e&#8339;","e&#8339;"],["ln x","1/x"],["sin x","cos x"],["cos x","&minus;sin x"]]},
    {"id":"91578-chain-rule-rec-01","standard":"91578","topic":"rules","subtopic":"chain-rule","type":"gap","prompt":"d/dx[sin(4x)] = ____.","options":["cos(4x)","4cos(4x)","&minus;4cos(4x)","4sin(4x)"],"answer":1,"why":"By the chain rule, differentiate the outside (sin&rarr;cos) and multiply by the derivative of the inside (4x&rarr;4): 4cos(4x)."},
    {"id":"91578-chain-rule-rec-02","standard":"91578","topic":"rules","subtopic":"chain-rule","type":"choice","prompt":"What is d/dx[e<sup>3x&sup2;</sup>]?","options":["e<sup>3x&sup2;</sup>","3x&sup2;e<sup>3x&sup2;</sup>","6xe<sup>3x&sup2;</sup>","6x"],"answer":2,"why":"The derivative of the inside function 3x&sup2; is 6x, multiplied by the unchanged exponential: 6xe<sup>3x&sup2;</sup>."},
    {"id":"91578-product-quotient-rec-01","standard":"91578","topic":"rules","subtopic":"product-quotient","type":"gap","prompt":"For y = x&sup2;sin x, using the product rule, dy/dx = ____.","options":["2x cos x","2xsin x + x&sup2;cos x","2xsin x &minus; x&sup2;cos x","x&sup2;cos x"],"answer":1,"why":"Product rule: v(du/dx)+u(dv/dx) with u=x&sup2;, v=sin x gives sin x(2x) + x&sup2;(cos x) = 2xsin x + x&sup2;cos x."},
    {"id":"91578-tangents-normals-rec-01","standard":"91578","topic":"applications","subtopic":"tangents-normals","type":"gap","prompt":"If f&prime;(2) = 3, the gradient of the normal to the curve at x=2 is ____.","options":["3","&minus;3","1/3","&minus;1/3"],"answer":3,"why":"The normal's gradient is the negative reciprocal of the tangent's gradient: &minus;1/3."},
    {"id":"91578-related-rates-rec-01","standard":"91578","topic":"applications","subtopic":"related-rates","type":"choice","prompt":"A balloon's radius r increases over time t. Which expression correctly relates the rate of change of volume to the rate of change of radius, given V = 4/3&pi;r&sup3;?","options":["dV/dt = 4&pi;r&sup2;","dV/dt = 4&pi;r&sup2;(dr/dt)","dV/dt = 4/3&pi;r&sup3;(dr/dt)","dV/dt = 4&pi;r(dr/dt)"],"answer":1,"why":"Differentiating V with respect to t via the chain rule: dV/dt = (dV/dr)(dr/dt) = 4&pi;r&sup2;(dr/dt)."},
    {"id":"91578-parametric-rec-01","standard":"91578","topic":"applications","subtopic":"parametric","type":"gap","prompt":"For x = t&sup2;, y = t&sup3;, dy/dx = ____.","options":["t","3t/2","1.5t","2t"],"answer":2,"why":"dy/dt=3t&sup2;, dx/dt=2t, so dy/dx = 3t&sup2;/2t = 1.5t (valid for t&ne;0)."},
    {"id":"91578-stationary-rec-01","standard":"91578","topic":"analysis","subtopic":"stationary","type":"gap","prompt":"At a stationary point of a curve, f&prime;(x) equals ____.","options":["1","0","undefined","the y-value"],"answer":1,"why":"A stationary point is, by definition, a point where the gradient of the tangent is zero, i.e. f&prime;(x)=0."},
    {"id":"91578-concavity-rec-01","standard":"91578","topic":"analysis","subtopic":"concavity","type":"choice","prompt":"At a local maximum, what is generally true of f&Prime;(x)?","options":["f&Prime;(x) &gt; 0","f&Prime;(x) &lt; 0","f&Prime;(x) = 0 always","f&Prime;(x) is undefined"],"answer":1,"why":"A negative second derivative at a stationary point means the curve is concave down there, confirming a local maximum."},
    {"id":"91578-optimisation-rec-01","standard":"91578","topic":"analysis","subtopic":"optimisation","type":"gap","prompt":"In an optimisation problem, after finding where the derivative equals zero, you should always ____ the stationary point before stating a final answer.","options":["ignore","classify (max, min, or neither)","delete","double"],"answer":1,"why":"A stationary point could be a maximum, minimum, or neither (e.g. an inflection point) &mdash; classification is essential before claiming it answers an optimisation question."},
    {"id":"91578-graph-properties-rec-01","standard":"91578","topic":"analysis","subtopic":"graph-properties","type":"match","prompt":"Match each graph property to its meaning.","pairs":[["Continuous at x=a","no break or jump in the graph at x=a"],["Differentiable at x=a","a well-defined single tangent line exists at x=a"],["Concave up","f&Prime;(x) &gt; 0, curve bends upward"]]}

  "build":[
    {"id":"91578-chain-rule-bld-01","standard":"91578","topic":"rules","subtopic":"chain-rule","stem":"y = cos(u) where u is itself a function of x leads to applying the chain rule dy/dx = (dy/du)(du/dx) leads to ____.","options":["dy/dx = &minus;sin(u)&middot;(du/dx)","dy/dx = &minus;sin(u)","dy/dx = sin(u)&middot;(du/dx)","dy/dx = cos(u)&middot;(du/dx)"],"answer":0,"why":"dy/du = &minus;sin(u), so multiplying by du/dx gives dy/dx = &minus;sin(u)&middot;(du/dx)."},
    {"id":"91578-product-quotient-bld-01","standard":"91578","topic":"rules","subtopic":"product-quotient","stem":"y = u/v is differentiated using the quotient rule leads to dy/dx = [v(du/dx) &minus; u(dv/dx)]/v&sup2; leads to ____.","options":["the order of the numerator terms does not matter","swapping the numerator's two terms changes the sign of the answer","v&sup2; in the denominator can be simplified to v","this formula only works when v is constant"],"answer":1,"why":"Because subtraction is not commutative, swapping v(du/dx) and u(dv/dx) in the numerator flips the sign of the whole derivative &mdash; the order matters."},
    {"id":"91578-tangents-normals-bld-01","standard":"91578","topic":"applications","subtopic":"tangents-normals","stem":"Finding f&prime;(a) gives the tangent's gradient at x=a leads to the normal must be perpendicular to the tangent leads to ____.","options":["the normal has the same gradient as the tangent","the normal's gradient is the negative reciprocal of f&prime;(a)","the normal is always vertical","the normal cannot be found without more information"],"answer":1,"why":"Perpendicular lines have gradients that multiply to &minus;1, so the normal's gradient is &minus;1/f&prime;(a)."},
    {"id":"91578-related-rates-bld-01","standard":"91578","topic":"applications","subtopic":"related-rates","stem":"Two quantities are connected by a geometric equation leads to differentiating that equation with respect to time using the chain rule leads to ____.","options":["an equation relating their rates of change","a new geometric shape","the original equation unchanged","an equation with no rates in it at all"],"answer":0,"why":"Differentiating a connecting equation with respect to time introduces dx/dt, dy/dt (etc.) terms via the chain rule, producing an equation that relates the rates directly."},
    {"id":"91578-parametric-bld-01","standard":"91578","topic":"applications","subtopic":"parametric","stem":"x and y are both given as functions of a parameter t leads to dy/dx is found using dy/dx = (dy/dt) &divide; (dx/dt) leads to ____.","options":["the parameter t is eliminated only at the very end, if a Cartesian equation is needed","t must always be eliminated first","dy/dx cannot be found without eliminating t","dx/dt is always equal to dy/dt"],"answer":0,"why":"The parametric derivative formula lets you find dy/dx directly in terms of t, without needing to eliminate the parameter to get a Cartesian equation first."},
    {"id":"91578-stationary-bld-01","standard":"91578","topic":"analysis","subtopic":"stationary","stem":"f&prime;(x)=0 is solved to find candidate stationary points leads to the sign of f&Prime;(x) (or of f&prime;(x) either side) is checked leads to ____.","options":["the stationary point is classified as a max, min, or point of inflection","the stationary point is automatically a maximum","no further work is needed","the original function must be re-differentiated from scratch"],"answer":0,"why":"Solving f&prime;(x)=0 only locates candidate stationary points; checking the second derivative's sign (or the first derivative's sign change) is what actually classifies each one."},
    {"id":"91578-concavity-bld-01","standard":"91578","topic":"analysis","subtopic":"concavity","stem":"f&Prime;(x) changes sign as x passes through a value leads to concavity switches from concave up to concave down (or vice versa) leads to ____.","options":["that point is a point of inflection","that point must be a local maximum","that point must be a local minimum","nothing significant has happened"],"answer":0,"why":"A genuine sign change in f&Prime;(x) is exactly the definition of a point of inflection &mdash; concavity actually switches there."},
    {"id":"91578-optimisation-bld-01","standard":"91578","topic":"analysis","subtopic":"optimisation","stem":"A quantity to be optimised is written as a function of one variable using a constraint leads to differentiating and setting the derivative to zero leads to ____.","options":["the candidate value(s) for the maximum or minimum are found","the problem is already fully solved with no further checking","the constraint becomes irrelevant","the function becomes linear"],"answer":0,"why":"Setting the derivative to zero locates the candidate optimal value(s); classifying and interpreting them in context is still needed to finish the problem."}
