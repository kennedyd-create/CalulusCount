  "explain":[
    {"id":"91578-chain-rule-exp-01","standard":"91578","topic":"rules","subtopic":"chain-rule","question":"Explain how to recognise when the chain rule is needed, using y = ln(cos x) as an example.","criteria":["identify an 'outer' and 'inner' function","outer function is ln, inner is cos x","differentiate outer, leaving inner unchanged","multiply by derivative of inner"],"merit":"y = ln(cos x) is a composite function: the outer function is ln(&middot;) and the inner function is cos x. Differentiating the outer function (1/&middot;) while leaving cos x inside, then multiplying by the derivative of the inner function (&minus;sin x), gives dy/dx = (1/cos x)&times;(&minus;sin x) = &minus;tan x.","excellence":"A chain rule situation is recognised whenever a function is applied to the output of another function, rather than the input variable x directly &mdash; here, ln is applied not to x but to the whole expression cos x, making cos x the 'inner' function and ln(&middot;) the 'outer' function. The chain rule states dy/dx = (dy/du)(du/dx), where u = cos x. Differentiating the outer function with respect to u gives d/du[ln u] = 1/u = 1/cos x, and differentiating the inner function gives du/dx = &minus;sin x. Multiplying these together gives dy/dx = (1/cos x)&times;(&minus;sin x) = &minus;sin x/cos x = &minus;tan x. Recognising this outer/inner structure before differentiating, rather than trying to apply a single derivative rule to the whole expression at once, is the key skill the chain rule tests."},
    {"id":"91578-optimisation-exp-01","standard":"91578","topic":"analysis","subtopic":"optimisation","question":"A rectangular paddock is to be fenced using 200 m of fencing, with one side against an existing wall (so fencing is only needed on 3 sides). Explain how calculus is used to find the maximum possible area.","criteria":["set up variables for the two dimensions","use the fencing constraint to eliminate one variable","write area as a function of a single variable","differentiate, solve for zero, and justify a maximum"],"merit":"Let x be the width (two sides) and y the length (one side, parallel to the wall). The constraint is 2x+y=200, so y=200&minus;2x. Area A=xy=x(200&minus;2x)=200x&minus;2x&sup2;. Differentiating, dA/dx=200&minus;4x. Setting this to zero gives x=50, and checking d&sup2;A/dx&sup2;=&minus;4&lt;0 confirms a maximum, giving y=100 and maximum area 5000 m&sup2;.","excellence":"Let x represent the width of the two fenced sides perpendicular to the wall, and y represent the length of the single fenced side parallel to the wall. Since only three sides need fencing, the constraint on the total fencing is 2x + y = 200, which rearranges to y = 200 &minus; 2x. The area to be maximised is A = xy, and substituting the constraint eliminates y, giving A(x) = x(200&minus;2x) = 200x &minus; 2x&sup2;, a function of the single variable x. Differentiating gives dA/dx = 200 &minus; 4x; setting this equal to zero and solving gives x = 50. To confirm this is a maximum rather than a minimum, the second derivative d&sup2;A/dx&sup2; = &minus;4 is negative everywhere, confirming the curve is concave down at x=50, so this stationary point is indeed a maximum. Substituting x=50 back into the constraint gives y=100, so the maximum enclosed area is A = 50&times;100 = 5000 m&sup2;. This response shows the complete optimisation process: forming the model from the constraint, reducing to one variable, differentiating, solving, and justifying the type of stationary point found."},
    {"id":"91578-graph-properties-exp-01","standard":"91578","topic":"analysis","subtopic":"graph-properties","question":"Explain why y = |x| is continuous at x = 0 but not differentiable there.","criteria":["continuity: no break or jump at x=0","differentiability requires a single well-defined tangent","gradient from the left differs from the gradient from the right","the sharp corner is why no unique tangent exists"],"merit":"y=|x| is continuous at x=0 because there is no break, jump or hole in the graph there &mdash; the curve passes smoothly through the point (0,0) without any gap. However, it is not differentiable at x=0 because the gradient approaching from the left is &minus;1, while the gradient approaching from the right is +1; since these do not agree, there is no single well-defined tangent line at the sharp corner.","excellence":"Continuity at a point requires only that the function has no break, jump, or hole there, and that the left-hand and right-hand values of the function actually meet at that point &mdash; y=|x| satisfies this at x=0, since both branches approach the value 0 as x&rarr;0 from either side. Differentiability is a stricter requirement: it demands that a single, well-defined tangent line (gradient) exists at that point, meaning the gradient approached from the left must equal the gradient approached from the right. For y=|x|, the left branch has gradient &minus;1 everywhere x&lt;0, and the right branch has gradient +1 everywhere x&gt;0; as x&rarr;0 from either side these gradients do not converge to the same value. This mismatch creates the sharp corner visible on the graph at the origin, and is exactly why a function can be continuous at a point without being differentiable there &mdash; continuity is a necessary but not sufficient condition for differentiability."},
    {"id":"91578-related-rates-exp-01","standard":"91578","topic":"applications","subtopic":"related-rates","question":"A ladder 5 m long leans against a vertical wall. The bottom slides away from the wall at 0.5 m/s. Explain how to find the rate at which the top of the ladder is sliding down the wall when the bottom is 3 m from the wall.","criteria":["set up Pythagoras relating the two distances","differentiate implicitly with respect to time","substitute known values including dx/dt","solve for the required rate dy/dt"],"merit":"Let x be the distance of the base from the wall and y the height of the top. By Pythagoras, x&sup2;+y&sup2;=25. Differentiating with respect to time: 2x(dx/dt)+2y(dy/dt)=0. When x=3, y=4 (since 3-4-5). Substituting x=3, dx/dt=0.5, y=4: 2(3)(0.5)+2(4)(dy/dt)=0, giving dy/dt=&minus;0.375 m/s (the negative sign shows the top is moving down).","excellence":"The ladder, wall, and ground form a right-angled triangle at every instant, so Pythagoras' theorem connects the two changing distances: x&sup2; + y&sup2; = 5&sup2; = 25, where x is the base's distance from the wall and y is the height of the top. Differentiating this equation implicitly with respect to time t, using the chain rule on each squared term, gives 2x(dx/dt) + 2y(dy/dt) = 0, an equation directly relating the two rates of change. When x=3, the corresponding height is found from the original equation: y&sup2;=25&minus;9=16, so y=4. Substituting x=3, y=4 and the known rate dx/dt=0.5 m/s into the differentiated equation gives 2(3)(0.5) + 2(4)(dy/dt) = 0, so 3 + 8(dy/dt) = 0, giving dy/dt = &minus;0.375 m/s. The negative sign is meaningful, not an error to discard: it confirms that y is decreasing, i.e. the top of the ladder is indeed sliding down the wall, at 0.375 m/s at that instant."},
    {"id":"91578-parametric-exp-01","standard":"91578","topic":"applications","subtopic":"parametric","question":"For the parametric curve x=t&sup2;, y=2t&sup3;, explain how to find d&sup2;y/dx&sup2;, and why this is more involved than finding dy/dx.","criteria":["find dy/dx first as (dy/dt)/(dx/dt)","differentiate dy/dx with respect to t","divide again by dx/dt","explain why a second chain-rule style step is required"],"merit":"First find dy/dx = (dy/dt)/(dx/dt) = 6t&sup2;/2t = 3t. To find d&sup2;y/dx&sup2;, differentiate this result (3t) with respect to t to get 3, then divide by dx/dt (=2t) again, giving d&sup2;y/dx&sup2; = 3/(2t). This extra division step is needed because dy/dx is itself a function of the parameter t, not of x directly.","excellence":"Finding dy/dx for a parametric curve uses dy/dx = (dy/dt) &divide; (dx/dt) = 6t&sup2; &divide; 2t = 3t. Finding the second derivative is not as simple as differentiating 3t directly with respect to x, because 3t is expressed in terms of the parameter t, not the variable x — there is no direct x-dependence to differentiate against. Instead, the correct method is d&sup2;y/dx&sup2; = [d/dt(dy/dx)] &divide; (dx/dt): differentiate the first derivative (3t) with respect to the parameter t, giving d/dt(3t)=3, and then divide once more by dx/dt=2t, giving d&sup2;y/dx&sup2; = 3/(2t). This extra division step is required precisely because parametric differentiation never produces y directly as a function of x; every derivative must pass back through the parameter t, which is what makes the second parametric derivative noticeably more involved than finding dy/dx alone."},
    {"id":"91578-standard-derivs-exp-01","standard":"91578","topic":"rules","subtopic":"standard-derivs","question":"Explain why d/dx(eˣ) = eˣ is a special property, not shared by other exponential functions like d/dx(2ˣ).","criteria":["state the standard result d/dx(e&#8339;)=e&#8339;","state d/dx(a&#8339;)=a&#8339;ln a for general base a","identify ln e = 1 as the reason e is special","link this to why e is chosen as the natural base for calculus"],"merit":"The general rule for exponential functions is d/dx(a&#8339;)=a&#8339;ln a. For a=e, this becomes e&#8339;ln e; since ln e =1, this simplifies exactly to e&#8339;, meaning the function equals its own derivative. For any other base, such as a=2, ln 2 &ne; 1, so d/dx(2&#8339;)=2&#8339;ln2, a different function from 2&#8339; itself.","excellence":"For a general exponential function a&#8339;, the derivative rule is d/dx(a&#8339;) = a&#8339;&middot;ln a, where the extra factor ln a arises from differentiating the exponent's base change into base e. This factor ln a equals 1 only when a = e, because ln e = 1 by the very definition of the natural logarithm as the inverse of e&#8339;. Substituting a = e into the general rule therefore gives d/dx(e&#8339;) = e&#8339;&middot;ln e = e&#8339;&middot;1 = e&#8339;, meaning the exponential function with base e is literally equal to its own derivative at every point. For any other base, such as a=2, ln 2 &asymp; 0.693 &ne; 1, so d/dx(2&#8339;) = 2&#8339;ln2 is a scaled version of 2&#8339;, not equal to it. This unique self-derivative property is exactly why e is chosen as the 'natural' base throughout calculus &mdash; it removes the extra ln a factor from every exponential and logarithmic derivative built on it."},
    {"id":"91578-product-quotient-exp-01","standard":"91578","topic":"rules","subtopic":"product-quotient","question":"Explain why differentiating y = x&sup2;/sin x correctly requires the quotient rule rather than differentiating the numerator and denominator separately and dividing the results.","criteria":["state the quotient rule formula correctly","explain that the derivative of a quotient is not the quotient of the derivatives","apply the correct formula to this example","contrast with the (incorrect) naive approach"],"merit":"The quotient rule states that for y=u/v, dy/dx=[v(du/dx)&minus;u(dv/dx)]/v&sup2;, not simply (du/dx)/(dv/dx). For y=x&sup2;/sin x, u=x&sup2;, v=sin x, so dy/dx = [sin x(2x) &minus; x&sup2;cos x]/sin&sup2;x. Naively dividing 2x by cos x would give a completely different and incorrect result.","excellence":"A common misconception is that the derivative of a quotient equals the quotient of the individual derivatives, i.e. that d/dx(u/v) would simply be (du/dx)/(dv/dx). This is false, because differentiation does not distribute over division the way it distributes over addition; u/v is fundamentally a product of u and 1/v, and differentiating 1/v itself requires its own (chain rule) working, which is exactly where the correct quotient rule formula, dy/dx=[v(du/dx)&minus;u(dv/dx)]/v&sup2;, comes from. For y=x&sup2;/sin x, correctly setting u=x&sup2; and v=sin x gives du/dx=2x and dv/dx=cos x, so the correct derivative is dy/dx = [sin x&middot;2x &minus; x&sup2;&middot;cos x] / sin&sup2;x = (2xsin x &minus; x&sup2;cos x)/sin&sup2;x. The naive approach of dividing 2x by cos x ignores both the product structure inside the correct formula and the squared denominator, and gives an answer with no valid mathematical justification."}
  ],
  "apply":[
    {"id":"91578-optimisation-app-01","standard":"91578","topic":"analysis","subtopic":"optimisation","question":"A cylindrical can must hold 500 cm&sup3; of liquid. Explain, without doing the full calculation, how calculus would be used to find the dimensions that minimise the material (surface area) used.","answer":"Write the surface area S as a function of one variable (e.g. radius r) by using the volume constraint V=&pi;r&sup2;h=500 to eliminate h, substituting h=500/(&pi;r&sup2;) into the surface area formula S=2&pi;r&sup2;+2&pi;rh. Differentiate S with respect to r, set dS/dr=0 and solve for r, then use the second derivative (or a sign check) to confirm this gives a minimum rather than a maximum."},
    {"id":"91578-related-rates-app-01","standard":"91578","topic":"applications","subtopic":"related-rates","question":"Sand is poured onto a conical pile at a constant rate, and the pile's height always equals its base radius. Explain how you would set up a related rates problem to find how fast the height is increasing.","answer":"Since height h equals radius r, substitute r=h into the volume formula V=&frac13;&pi;r&sup2;h to get V as a function of h alone: V=&frac13;&pi;h&sup3;. Differentiate with respect to time: dV/dt=&pi;h&sup2;(dh/dt). Since dV/dt (the rate sand is poured) is known, and h can be measured or calculated at the moment of interest, this equation can be solved for dh/dt."},
    {"id":"91578-graph-properties-app-01","standard":"91578","topic":"analysis","subtopic":"graph-properties","question":"A graph has a vertical tangent at x=2. Explain whether the function is differentiable at x=2, and why.","answer":"The function is not differentiable at x=2. A vertical tangent means the gradient is undefined (effectively infinite) at that point, so there is no finite, well-defined derivative there, even though the function may still be continuous at x=2."},
    {"id":"91578-chain-rule-app-01","standard":"91578","topic":"rules","subtopic":"chain-rule","question":"A student differentiates y=(3x+1)&#8309; and writes dy/dx=5(3x+1)&#8308; without any factor of 3. Identify and explain the error.","answer":"The student applied the power rule to the outer function correctly but forgot the chain rule's required multiplication by the derivative of the inner function, 3x+1, which is 3. The correct derivative is dy/dx=5(3x+1)&#8308;&times;3=15(3x+1)&#8308;."},
    {"id":"91578-stationary-app-01","standard":"91578","topic":"analysis","subtopic":"stationary","question":"A function has f&prime;(x)=0 at x=5, but f&Prime;(5) is also equal to 0. Explain why the second derivative test alone cannot classify this stationary point, and what should be done instead.","answer":"When f&Prime;(5)=0, the second derivative test is inconclusive &mdash; it cannot tell whether x=5 is a maximum, minimum, or point of inflection. Instead, the sign of f&prime;(x) should be checked at values just below and just above x=5: if f&prime;(x) changes from positive to negative, it is a maximum; negative to positive, a minimum; if the sign does not change, it is a point of inflection with a horizontal tangent."},
    {"id":"91578-tangents-normals-app-01","standard":"91578","topic":"applications","subtopic":"tangents-normals","question":"Two curves intersect at a point and have the same tangent gradient there. Explain what this tells you about how the curves meet.","answer":"If the curves intersect and share the same tangent gradient at that point, they touch smoothly rather than crossing at an angle &mdash; they are tangent to each other at that point, meaning they momentarily have the exact same direction of travel there."}
  ],
  "worked":[
    {"id":"91578-optimisation-wrk-01","standard":"91578","topic":"analysis","subtopic":"optimisation","title":"Minimising material for an open-top box","question":"An open-top box with a square base is to have a volume of 32 m&sup3;. Find the dimensions that minimise the surface area of material used.","plan":["Define variables for the base side and height.","Use the volume constraint to eliminate one variable.","Write surface area as a function of one variable and differentiate.","Solve, classify, and interpret the result in context."],"answer":"Let x be the base side length and h the height. Volume: x&sup2;h=32, so h=32/x&sup2;. Surface area (open top): S=x&sup2;+4xh=x&sup2;+4x(32/x&sup2;)=x&sup2;+128/x. Differentiating: dS/dx=2x&minus;128/x&sup2;. Setting this to zero: 2x=128/x&sup2;, so 2x&sup3;=128, x&sup3;=64, x=4. Checking d&sup2;S/dx&sup2;=2+256/x&sup3;, which is positive for x=4, confirming a minimum. Then h=32/16=2. The minimising dimensions are a 4 m &times; 4 m base with height 2 m.","why":"This response models the full problem from a physical constraint through to a fully justified, correctly interpreted answer, including the second derivative check that distinguishes Excellence from a merely correct numeric answer.","trap":"Forgetting that the box is open-top (and so including a top face's area in S) is a very common modelling error &mdash; always re-read exactly which faces the material actually covers."},
    {"id":"91578-related-rates-wrk-01","standard":"91578","topic":"applications","subtopic":"related-rates","title":"Related rates with a shadow problem","question":"A 2 m tall person walks directly away from a 6 m lamp post at 1.5 m/s. Find the rate at which the length of their shadow is increasing.","plan":["Set up similar triangles relating the person's distance and the shadow length.","Write an equation connecting the two lengths.","Differentiate with respect to time.","Solve for the required rate."],"answer":"Let x be the person's distance from the lamp post and s be the shadow length. By similar triangles, 6/(x+s) = 2/s, so 6s=2x+2s, giving 4s=2x, so s=x/2. Differentiating with respect to time: ds/dt = (1/2)(dx/dt) = (1/2)(1.5) = 0.75 m/s.","why":"Setting up the similar-triangles relationship correctly before differentiating &mdash; rather than guessing a direct proportionality &mdash; is the key modelling step this Excellence-level response demonstrates.","trap":"A common error is to confuse the shadow length s with the tip-of-shadow distance (x+s) from the lamp post &mdash; keep these two lengths clearly distinct throughout."},
    {"id":"91578-parametric-wrk-01","standard":"91578","topic":"applications","subtopic":"parametric","title":"Tangent to a parametric curve","question":"A curve is defined by x = 2cos t, y = 2sin t. Find the equation of the tangent at t = &pi;/4.","plan":["Find dx/dt and dy/dt.","Form dy/dx in terms of t.","Substitute t=&pi;/4 to get the gradient and the point.","Write the tangent line equation."],"answer":"dx/dt=&minus;2sin t, dy/dt=2cos t, so dy/dx = 2cos t / (&minus;2sin t) = &minus;cot t. At t=&pi;/4: gradient = &minus;cot(&pi;/4) = &minus;1. The point is x=2cos(&pi;/4)=&radic;2, y=2sin(&pi;/4)=&radic;2. Tangent: y&minus;&radic;2 = &minus;1(x&minus;&radic;2), i.e. y = &minus;x + 2&radic;2.","why":"Working entirely in terms of the parameter t before substituting a specific value, and then correctly forming the line equation from the resulting point and gradient, is exactly the complete parametric-tangent method Excellence responses need.","trap":"Do not substitute t=&pi;/4 into x and y before finding dy/dx symbolically first &mdash; find the general expression for dy/dx in terms of t, then substitute."},
    {"id":"91578-standard-derivs-wrk-01","standard":"91578","topic":"rules","subtopic":"standard-derivs","title":"Differentiating a combination of standard functions","question":"Differentiate y = 3ln(x) &minus; 2e<sup>&minus;x</sup> + 5sin x fully.","plan":["Differentiate each term separately using standard derivative rules.","Apply the chain rule to the e&#8315;&#8339; term.","Combine all three results.","Check the sign on each term."],"answer":"d/dx[3ln x] = 3/x. d/dx[&minus;2e&#8315;&#8339;] = &minus;2&times;(&minus;1)e&#8315;&#8339; = 2e&#8315;&#8339; (using the chain rule, since the inner derivative of &minus;x is &minus;1). d/dx[5sin x] = 5cos x. Combining: dy/dx = 3/x + 2e&#8315;&#8339; + 5cos x.","why":"Handling the chain rule correctly on the exponential term (including the sign flip from the inner derivative of &minus;x) while keeping the other two terms accurate is exactly the kind of careful, error-free execution that separates Excellence from Merit here.","trap":"Forgetting the extra factor of &minus;1 from differentiating the inner function &minus;x inside e&#8315;&#8339; is one of the most common sign errors on this type of question."},
    {"id":"91578-graph-properties-wrk-01","standard":"91578","topic":"analysis","subtopic":"graph-properties","title":"Full curve analysis with justification","question":"For f(x) = x&sup3; &minus; 3x&sup2;, find and classify all stationary points, and state where the curve is concave up.","plan":["Differentiate to find f&prime;(x) and solve f&prime;(x)=0.","Find f&Prime;(x) and evaluate it at each stationary point.","Classify each stationary point using the sign of f&Prime;(x).","Determine the sign of f&Prime;(x) generally to find where the curve is concave up."],"answer":"f&prime;(x)=3x&sup2;&minus;6x=3x(x&minus;2), so stationary points are at x=0 and x=2. f&Prime;(x)=6x&minus;6. At x=0: f&Prime;(0)=&minus;6&lt;0, a local maximum, with f(0)=0, so (0,0) is a local max. At x=2: f&Prime;(2)=6&gt;0, a local minimum, with f(2)=8&minus;12=&minus;4, so (2,&minus;4) is a local min. For concavity, f&Prime;(x)&gt;0 when 6x&minus;6&gt;0, i.e. x&gt;1, so the curve is concave up for x&gt;1.","why":"This response systematically works through every stage of curve analysis &mdash; stationary points, their classification by the second derivative, and a full concavity interval &mdash; rather than stopping once the stationary points alone are found.","trap":"Forgetting to substitute the x-values back into the original function f(x) (not just f&prime;(x)) to find the actual y-coordinates of each stationary point is a very common omission."}
  ],

"91579": {
  "id":"91579","title":"Integration","icon":"area","colour":"integ",
  "summary":"Standard integrals, the reverse chain rule, rational functions and ln|f(x)|, definite integrals and areas, the trapezium rule, and differential equations including growth, decay and kinematics.",
  "learn":[
    {"title":"Standard integrals","points":[
      "&int;x&#8319;dx = x&#8319;&#8314;&sup1;/(n+1) + c, for n &ne; &minus;1 &mdash; add one to the power, divide by the new power, and always add the constant of integration c for an indefinite integral.",
      "&int;e&#8339;dx = e&#8339; + c; &int;(1/x)dx = ln|x| + c &mdash; the absolute value matters, since ln is only defined for positive numbers but 1/x is defined for x &ne; 0.",
      "&int;cos x dx = sin x + c and &int;sin x dx = &minus;cos x + c, assuming x is in radians; &int;sec&sup2;x dx = tan x + c.",
      "Integration is the reverse process of differentiation: to check an integral, differentiate your answer and confirm it returns the original integrand.",
      "The constant of integration c is essential for every indefinite integral &mdash; omitting it, or assuming c=0 without justification, is one of the most common ways marks are lost on this standard.",
      "A definite integral &int;<sub>a</sub><sup>b</sup>f(x)dx = F(b) &minus; F(a), where F is any antiderivative of f; the constant of integration cancels out automatically and does not need to be included."
    ]},
    {"title":"Reverse chain rule &amp; ln|f(x)|","points":[
      "The reverse chain rule integrates expressions of the form f(g(x))&middot;g&prime;(x) by recognising the pattern, rather than expanding everything out first &mdash; e.g. &int;(3x+1)&#8309;dx = (3x+1)&#8310;/(6&times;3) + c = (3x+1)&#8310;/18 + c.",
      "For &int;(ax+b)&#8319;dx, the shortcut is [(ax+b)&#8319;&#8314;&sup1;] / [a(n+1)] + c &mdash; divide by both the new power AND the coefficient a of x inside the bracket.",
      "&int;[f&prime;(x)/f(x)]dx = ln|f(x)| + c whenever the numerator is (or is a multiple of) the derivative of the denominator &mdash; always check this relationship before assuming a rational integral needs ln.",
      "Not every rational function integrates to a natural log &mdash; if the numerator is not a multiple of the derivative of the denominator, a different technique (such as algebraic manipulation or a substitution) is needed instead.",
      "Recognise a reverse chain rule opportunity by checking whether the derivative of the 'inside' function appears (or nearly appears, up to a constant multiple) elsewhere in the integrand.",
      "Trigonometric integrals sometimes require a double-angle or other identity first, to rewrite the integrand into a form that can actually be integrated directly &mdash; e.g. &int;cos&sup2;x dx needs cos&sup2;x = &frac12;(1+cos2x) before integrating term by term."
    ]},
    {"title":"Definite integrals, areas &amp; numerical methods","points":[
      "The definite integral &int;<sub>a</sub><sup>b</sup>f(x)dx gives the signed area between the curve and the x-axis from x=a to x=b &mdash; area below the x-axis counts as negative.",
      "To find the actual (unsigned) area between a curve and the x-axis when the curve crosses the axis, split the integral at each crossing point and take the absolute value of each piece before adding them.",
      "The area between two curves y=f(x) and y=g(x) from x=a to x=b (where f(x) &ge; g(x) on that interval) is &int;<sub>a</sub><sup>b</sup>[f(x) &minus; g(x)]dx &mdash; always subtract the lower curve from the upper curve.",
      "The trapezium rule approximates &int;<sub>a</sub><sup>b</sup>f(x)dx &asymp; &frac12;h[y&#8320;+y&#8345;+2(y&#8321;+y&#8322;+&hellip;+y&#8345;&#8315;&#8321;)], where h=(b&minus;a)/n is the width of each of the n strips.",
      "More strips (a larger n, smaller h) generally gives a more accurate trapezium rule estimate, but at the cost of more calculation &mdash; a concave-up curve sags below the straight chord joining two of its points, so the trapezium rule slightly over-estimates the area there; a concave-down curve bulges above its chord, so the trapezium rule slightly under-estimates the area there.",
      "Always read carefully whether a question wants an exact answer (via integration) or an approximate one (via the trapezium rule) &mdash; the two methods are not interchangeable and are assessed differently."
    ]},
    {"title":"Differential equations &amp; applications","points":[
      "A differential equation of the form dy/dx = f(x) is solved by direct integration: y = &int;f(x)dx.",
      "A differential equation of the form d&sup2;y/dx&sup2; = f(x) needs two successive integrations, each introducing its own constant of integration, typically found using two separate boundary/initial conditions.",
      "Separable variables: for dy/dx = f(x)g(y), rearrange to (1/g(y))dy = f(x)dx, then integrate both sides separately, each with its own constant (which can be combined into one constant afterwards).",
      "Exponential growth and decay follows dy/dt = ky, whose general solution is y = Ae<sup>kt</sup>, where A is the initial value (at t=0) and k is positive for growth, negative for decay.",
      "Newton's Law of Cooling states the rate of temperature change is proportional to the difference between the object's temperature and the surrounding (ambient) temperature: dT/dt = &minus;k(T&minus;T<sub>a</sub>), which separates and integrates to give an exponential approach toward T<sub>a</sub>.",
      "In kinematics, velocity is the integral of acceleration (v=&int;a dt) and displacement is the integral of velocity (x=&int;v dt); always use given initial conditions to find the constant of integration at each stage."
    ]}
  ],

    {"id":"91579-standard-integrals-rec-01","standard":"91579","topic":"techniques","subtopic":"standard-integrals","type":"gap","prompt":"&int;x&#8308;dx = ____.","options":["4x&sup3;+c","x&#8309;/5+c","x&#8309;+c","x&#8308;/4+c"],"answer":1,"why":"Add one to the power (4&rarr;5) and divide by the new power: x&#8309;/5+c."},
    {"id":"91579-standard-integrals-rec-02","standard":"91579","topic":"techniques","subtopic":"standard-integrals","type":"match","prompt":"Match each function to its indefinite integral (+c omitted for brevity).","pairs":[["e&#8339;","e&#8339;"],["1/x","ln|x|"],["cos x","sin x"],["sin x","&minus;cos x"]]},
    {"id":"91579-reverse-chain-rec-01","standard":"91579","topic":"techniques","subtopic":"reverse-chain","type":"gap","prompt":"&int;(2x+5)&#8310;dx = ____.","options":["(2x+5)&#8311;/7+c","(2x+5)&#8311;/14+c","7(2x+5)&#8311;+c","(2x+5)&#8311;/2+c"],"answer":1,"why":"Using the reverse chain rule shortcut, divide by both the new power (7) and the coefficient inside the bracket (2): (2x+5)&#8311;/(7&times;2)+c = (2x+5)&#8311;/14+c."},
    {"id":"91579-rational-ln-rec-01","standard":"91579","topic":"techniques","subtopic":"rational-ln","type":"choice","prompt":"&int;[2x/(x&sup2;+1)]dx = ____.","options":["ln|x&sup2;+1|+c","2ln|x&sup2;+1|+c","x&sup2;ln|x&sup2;+1|+c","1/(x&sup2;+1)+c"],"answer":0,"why":"The numerator 2x is exactly the derivative of the denominator x&sup2;+1, so this fits &int;f&prime;(x)/f(x)dx = ln|f(x)|+c directly."},
    {"id":"91579-trig-identities-rec-01","standard":"91579","topic":"techniques","subtopic":"trig-identities","type":"gap","prompt":"To integrate cos&sup2;x, the standard first step is to rewrite it using the identity cos&sup2;x = ____.","options":["1 &minus; sin&sup2;x","&frac12;(1+cos2x)","sin&sup2;x &minus; 1","2cos x"],"answer":1,"why":"The double-angle identity &frac12;(1+cos2x) turns cos&sup2;x into a form that can be integrated term by term, since &int;cos&sup2;x dx cannot be found directly by a standard rule."},
    {"id":"91579-definite-rec-01","standard":"91579","topic":"areas","subtopic":"definite","type":"gap","prompt":"When evaluating a definite integral &int;<sub>a</sub><sup>b</sup>f(x)dx, the constant of integration c ____.","options":["must always be included","cancels out and is not needed","doubles in value","becomes negative"],"answer":1,"why":"Because F(b)+c &minus; (F(a)+c) = F(b) &minus; F(a), the constant cancels automatically in a definite integral."},
    {"id":"91579-area-under-rec-01","standard":"91579","topic":"areas","subtopic":"area-under","type":"choice","prompt":"A curve lies entirely below the x-axis between x=1 and x=3. What is true of &int;&#8321;&sup3;f(x)dx compared with the actual (unsigned) area?","options":["They are equal","The integral is the negative of the actual area","The integral is always zero","The integral is double the actual area"],"answer":1,"why":"A definite integral gives signed area; when the curve is below the x-axis, the integral evaluates to a negative number equal in size to the actual (positive) area."},
    {"id":"91579-numerical-rec-01","standard":"91579","topic":"areas","subtopic":"numerical","type":"gap","prompt":"In the trapezium rule, h = ____.","options":["(a+b)/n","(b&minus;a)/n","n/(b&minus;a)","a&minus;b"],"answer":1,"why":"h is the width of each strip, found by dividing the total interval length (b&minus;a) by the number of strips n."},
    {"id":"91579-forming-de-rec-01","standard":"91579","topic":"diffeq","subtopic":"forming-de","type":"gap","prompt":"If d&sup2;y/dx&sup2; = f(x), finding y requires integrating ____ time(s).","options":["zero","once","twice","three times"],"answer":2,"why":"Going from a second derivative back to y requires two successive integrations, each producing its own constant of integration."},
    {"id":"91579-separable-rec-01","standard":"91579","topic":"diffeq","subtopic":"separable","type":"choice","prompt":"To solve dy/dx = xy using separation of variables, the first correct rearrangement is:","options":["dy/dx = xy stays as is","(1/y)dy = x dx","y dy = (1/x) dx","dy = xy dx only"],"answer":1,"why":"Separating variables means gathering all y terms (including dy) on one side and all x terms (including dx) on the other: (1/y)dy = x dx."},
    {"id":"91579-growth-decay-rec-01","standard":"91579","topic":"diffeq","subtopic":"growth-decay","type":"gap","prompt":"The general solution to dy/dt = ky is y = ____.","options":["kt+c","Ae&#8342;&#8348;","At&#8342;","A+kt"],"answer":1,"why":"dy/dt=ky is an exponential growth/decay equation whose general solution is y=Ae&#8342;&#8348;, where A is the value of y when t=0."},
    {"id":"91579-kinematics-rec-01","standard":"91579","topic":"diffeq","subtopic":"kinematics","type":"match","prompt":"Match each kinematics quantity to how it is found from another.","pairs":[["Velocity from acceleration","v = &int;a dt"],["Displacement from velocity","x = &int;v dt"],["Acceleration from velocity","a = dv/dt"]]}

  "build":[
    {"id":"91579-standard-integrals-bld-01","standard":"91579","topic":"techniques","subtopic":"standard-integrals","stem":"An indefinite integral is evaluated leads to no boundary values are given to find a specific constant leads to ____.","options":["the constant of integration c must still be included in the answer","the constant can be safely ignored","c is always equal to zero","the integral is left incomplete without a numeric constant"],"answer":0,"why":"Without boundary conditions, c cannot be found numerically, but it must still appear symbolically in the answer &mdash; omitting it is marked as an incomplete integral."},
    {"id":"91579-reverse-chain-bld-01","standard":"91579","topic":"techniques","subtopic":"reverse-chain","stem":"An integrand has the form f(g(x))&middot;g&prime;(x) leads to recognising the reverse chain rule pattern leads to ____.","options":["the integral can be found directly without expanding brackets first","the integrand must be fully expanded before integrating","the integral does not exist","substitution is never useful here"],"answer":0,"why":"Recognising the f(g(x))&middot;g&prime;(x) pattern lets you integrate directly using the reverse chain rule shortcut, avoiding a lengthy expansion."},
    {"id":"91579-rational-ln-bld-01","standard":"91579","topic":"techniques","subtopic":"rational-ln","stem":"A rational integrand's numerator is checked against the derivative of its denominator leads to they match (up to a constant multiple) leads to ____.","options":["the integral is ln|denominator|, scaled by that constant, plus c","the integral is always undefined","the integral must use the power rule instead","no further working is needed to write the final answer"],"answer":0,"why":"When the numerator is a constant multiple of the denominator's derivative, the integral is that constant multiplied by ln|denominator|, plus c."},
    {"id":"91579-area-under-bld-01","standard":"91579","topic":"areas","subtopic":"area-under","stem":"A curve crosses the x-axis between the two limits of integration leads to a single definite integral over the whole interval would let positive and negative areas cancel leads to ____.","options":["the integral must be split at the crossing point(s) and each piece's absolute value taken","this never causes a problem","the total area is always zero","only the first crossing point matters"],"answer":0,"why":"To find the true unsigned area when a curve crosses the axis, split the integral at every crossing point and add the absolute value of each resulting piece."},
    {"id":"91579-numerical-bld-01","standard":"91579","topic":"areas","subtopic":"numerical","stem":"The number of strips n in a trapezium rule estimate is increased leads to each strip becomes narrower (h decreases) leads to ____.","options":["the estimate generally becomes more accurate, at the cost of more calculation","the estimate always becomes worse","h must be recalculated using a different formula","the true integral value changes"],"answer":0,"why":"Narrower strips generally approximate the curve's shape more closely, improving accuracy, though more terms must then be calculated and summed."},
    {"id":"91579-separable-bld-01","standard":"91579","topic":"diffeq","subtopic":"separable","stem":"dy/dx = f(x)g(y) is rearranged to (1/g(y))dy = f(x)dx leads to integrating both sides separately leads to ____.","options":["a relationship between y and x that can be solved for y (or left implicit)","the equation becomes impossible to solve","only x can now be found, not y","the constants from each side must be kept as two separate constants forever"],"answer":0,"why":"Once separated and integrated, the two results combine (with a single overall constant) into a relationship between y and x, which can often be rearranged explicitly for y."},
    {"id":"91579-growth-decay-bld-01","standard":"91579","topic":"diffeq","subtopic":"growth-decay","stem":"A population's rate of change is proportional to its current size leads to writing dP/dt = kP and solving leads to ____.","options":["exponential growth or decay, P = Ae&#8342;&#8348;, depending on the sign of k","linear growth only","a constant population size","a population that cannot be modelled with calculus"],"answer":0,"why":"Any rate proportional to the current value produces exponential behaviour once solved; the sign of the constant k determines growth (k&gt;0) or decay (k&lt;0)."},
    {"id":"91579-kinematics-bld-01","standard":"91579","topic":"diffeq","subtopic":"kinematics","stem":"Acceleration a(t) is integrated with respect to time leads to a constant of integration appears leads to ____.","options":["an initial velocity condition is needed to find that constant","the constant can always be assumed to be zero","velocity cannot be found from acceleration by integration","the constant does not affect the velocity function"],"answer":0,"why":"Integrating a(t) gives v(t) plus an unknown constant; a known initial velocity (e.g. v at t=0) is needed to determine that specific constant's value."}

  "explain":[
    {"id":"91579-rational-ln-exp-01","standard":"91579","topic":"techniques","subtopic":"rational-ln","question":"Explain why &int;[x/(x&sup2;+1)]dx = &frac12;ln(x&sup2;+1) + c, including where the factor of &frac12; comes from.","criteria":["derivative of denominator is 2x, not x","numerator x is half of that derivative","adjust with a factor of &frac12; outside the integral","state the final result including why no absolute value bars are needed"],"merit":"The derivative of the denominator x&sup2;+1 is 2x, but the numerator here is only x, which is half of 2x. Writing x = &frac12;(2x) lets the integral be rewritten as &frac12;&int;[2x/(x&sup2;+1)]dx, which now exactly matches the f&prime;(x)/f(x) pattern, giving &frac12;ln(x&sup2;+1)+c. No absolute value bars are needed since x&sup2;+1 is always positive.","excellence":"The pattern &int;f&prime;(x)/f(x)dx = ln|f(x)|+c requires the numerator to be exactly the derivative of the denominator. Here f(x)=x&sup2;+1, so f&prime;(x)=2x, but the given numerator is only x, exactly half of f&prime;(x). To use the pattern, the integrand is rewritten by factoring out &frac12;: x/(x&sup2;+1) = &frac12;&middot;[2x/(x&sup2;+1)], which does not change the value of the integrand since &frac12;&times;2=1. Now the bracketed expression exactly matches f&prime;(x)/f(x), so integrating gives &frac12;&times;ln|x&sup2;+1|+c. Since x&sup2;+1 is a sum of a square and a positive constant, it is always strictly positive for every real x, so the absolute value bars can be dropped without changing the answer, giving the simplified final result &frac12;ln(x&sup2;+1)+c."},
    {"id":"91579-area-under-exp-01","standard":"91579","topic":"areas","subtopic":"area-under","question":"Explain how to find the actual area enclosed between y=x&sup2;&minus;4 and the x-axis from x=&minus;3 to x=3, given that the curve dips below the x-axis between x=&minus;2 and x=2.","criteria":["identify the x-intercepts as the split points","integrate each piece separately","take absolute values of the piece(s) below the axis","add all pieces together for the total area"],"merit":"The curve crosses the x-axis at x=&minus;2 and x=2. Split the integral into three pieces: [&minus;3,&minus;2], [&minus;2,2] and [2,3]. The middle piece is below the axis, so its integral will be negative &mdash; take its absolute value. Add the absolute values of all three pieces to get the total actual area.","excellence":"Because y=x&sup2;&minus;4 crosses the x-axis exactly where x&sup2;=4, i.e. at x=&minus;2 and x=2, a single integral from &minus;3 to 3 would let the negative area (where the curve dips below the axis, between x=&minus;2 and x=2) partially cancel the positive area on either side, giving a misleadingly small total that is not the actual enclosed area. To find the true area, the integral must be split at each crossing point into three separate integrals: &int;&#8315;&sup3;&#8315;&sup2;(x&sup2;&minus;4)dx, &int;&#8315;&sup2;&sup2;(x&sup2;&minus;4)dx, and &int;&sup2;&sup3;(x&sup2;&minus;4)dx. The first and third pieces will evaluate to positive numbers (the curve is above the axis there), while the middle piece will evaluate to a negative number (the curve is below the axis there); taking the absolute value of this middle piece converts it to the correct positive area it represents. Adding the absolute values of all three pieces together, rather than simply evaluating one integral from &minus;3 to 3, gives the correct total actual area enclosed."},
    {"id":"91579-growth-decay-exp-01","standard":"91579","topic":"diffeq","subtopic":"growth-decay","question":"A hot drink obeys Newton's Law of Cooling, dT/dt = &minus;k(T&minus;T<sub>a</sub>). Explain why the temperature approaches, but never quite reaches, the ambient temperature T<sub>a</sub>.","criteria":["separate variables and integrate","solution has form T=T<sub>a</sub>+Ce&#8315;&#8342;&#8348;","the exponential term shrinks toward zero as t increases","it never reaches exactly zero for finite t"],"merit":"Separating and integrating dT/dt=&minus;k(T&minus;T<sub>a</sub>) gives a solution of the form T=T<sub>a</sub>+Ce&#8315;&#8342;&#8348;. As t increases, e&#8315;&#8342;&#8348; gets smaller and smaller, approaching (but never actually reaching) zero, so T approaches T<sub>a</sub> but never exactly equals it for any finite time.","excellence":"Separating the variables in dT/dt = &minus;k(T&minus;T<sub>a</sub>) gives [1/(T&minus;T<sub>a</sub>)]dT = &minus;k dt, and integrating both sides gives ln|T&minus;T<sub>a</sub>| = &minus;kt + c, which rearranges (taking exponentials of both sides) to T = T<sub>a</sub> + Ce&#8315;&#8342;&#8348;, where C is a constant determined by the initial temperature. Since k&gt;0 for a cooling object, the exponential term e&#8315;&#8342;&#8348; is a strictly decreasing, strictly positive function of t: as t increases without bound, e&#8315;&#8342;&#8348; decreases toward zero but is mathematically never exactly equal to zero for any finite value of t. Because T = T<sub>a</sub> + Ce&#8315;&#8342;&#8348;, this means T gets arbitrarily close to T<sub>a</sub> as time passes, but the model predicts it never exactly equals T<sub>a</sub> &mdash; the temperature difference shrinks toward, but mathematically never reaches, zero."},
    {"id":"91579-numerical-exp-01","standard":"91579","topic":"areas","subtopic":"numerical","question":"Explain why the trapezium rule tends to under-estimate the area under a curve that is concave down, using a description of the shapes involved.","criteria":["trapezium rule connects points on the curve with straight chords","concave down means the curve bulges above those chords","the straight-edged trapezium therefore misses area above the chord but below the curve","this missing area is why the estimate is too low"],"merit":"The trapezium rule approximates the area under a curve using straight-line chords joining points on the curve. When the curve is concave down, it bulges upward above these chords between consecutive points, so there is a sliver of true area, between the chord and the actual curve, that the trapezium shape does not include. Missing this sliver makes the trapezium rule's total an under-estimate of the true area.","excellence":"The trapezium rule replaces the true, curved boundary of the region with a series of straight-line chords, each joining two adjacent points on the actual curve. For a concave-down curve (where f&Prime;(x)&lt;0), the curve lies entirely above any chord drawn between two of its own points &mdash; this is the defining geometric property of concavity: a concave-down shape bulges outward relative to a straight line connecting two of its points. Since the trapezium rule uses that straight chord as the top edge of each strip, and the true curve sits above this chord across the whole strip, there is a thin sliver of area (between the chord below and the curve above) that lies inside the true region but outside the trapezium. This sliver is never counted by the trapezium rule, so the total estimate is smaller than the true area &mdash; an under-estimate. The reverse geometric argument, that a concave-up curve sags below its own chord, is exactly why the trapezium rule over-estimates area under a concave-up curve instead: there, the chord sits above the curve, and the trapezium counts extra area that the true curve does not actually cover."},
    {"id":"91579-forming-de-exp-01","standard":"91579","topic":"diffeq","subtopic":"forming-de","question":"Given d&sup2;y/dx&sup2; = 6x, dy/dx = 5 when x=0, and y=2 when x=0, explain the full process for finding y as a function of x.","criteria":["integrate once to find dy/dx with a constant","use the first condition to find that constant","integrate again to find y with a second constant","use the second condition to find the final constant"],"merit":"Integrating d&sup2;y/dx&sup2;=6x once gives dy/dx=3x&sup2;+c&#8321;. Using dy/dx=5 at x=0: 5=0+c&#8321;, so c&#8321;=5, giving dy/dx=3x&sup2;+5. Integrating again gives y=x&sup3;+5x+c&#8322;. Using y=2 at x=0: 2=0+0+c&#8322;, so c&#8322;=2. The final answer is y=x&sup3;+5x+2.","excellence":"Since the differential equation is second-order (d&sup2;y/dx&sup2;=6x), reaching y requires two successive integrations, and each one introduces its own independent constant of integration that must be resolved using one of the two given conditions. Integrating once with respect to x gives dy/dx = 3x&sup2; + c&#8321;. Applying the first condition, dy/dx=5 at x=0, gives 5 = 3(0)&sup2;+c&#8321;, so c&#8321;=5, and the first derivative is fully determined as dy/dx=3x&sup2;+5. Integrating this result a second time gives y = x&sup3; + 5x + c&#8322;. Applying the second condition, y=2 at x=0, gives 2 = 0&sup3;+5(0)+c&#8322;, so c&#8322;=2. This finally gives the fully determined solution y = x&sup3;+5x+2. The key structural point is that each of the two conditions resolves exactly one of the two constants, in the same order that the constants were introduced by each successive integration."},
    {"id":"91579-separable-exp-01","standard":"91579","topic":"diffeq","subtopic":"separable","question":"Explain why dy/dx = x + y cannot be solved by simple separation of variables, unlike dy/dx = xy.","criteria":["separation requires the right side to factor into a function of x times a function of y","x+y cannot be factored this way","xy is already in the required product form","state that a different method would be needed for x+y"],"merit":"Separation of variables requires the right-hand side to be written as a product of a function of x only and a function of y only, i.e. f(x)g(y). xy is already exactly in this form (f(x)=x, g(y)=y), so it separates directly. However, x+y is a sum, not a product, and cannot be factored into f(x)g(y) form, so simple separation does not apply to it.","excellence":"The method of separation of variables specifically requires the differential equation to be rearrangeable into the form dy/dx = f(x)&middot;g(y), a product of one function depending only on x and another depending only on y, so that the two variables can be fully isolated onto opposite sides of the equation. For dy/dx=xy, the right-hand side is already precisely in this form, with f(x)=x and g(y)=y, so dividing both sides by y immediately separates the variables into (1/y)dy = x dx. For dy/dx = x+y, however, the right-hand side is a sum of an x-term and a y-term, not a product of an x-only function and a y-only function; there is no way to algebraically factor x+y into f(x)&middot;g(y) form, since a sum generally cannot be rewritten as a product of its separate parts. This structural difference is exactly why x+y resists simple separation, while xy does not; solving dy/dx=x+y would require a different technique, such as recognising it as a linear first-order differential equation and using an integrating factor, which goes beyond what separation of variables alone can do."},
    {"id":"91579-reverse-chain-exp-01","standard":"91579","topic":"techniques","subtopic":"reverse-chain","question":"Explain why &int;sin(x&sup2;)dx cannot be found using the simple reverse chain rule shortcut used for &int;2x cos(x&sup2;)dx, even though both integrands involve sin or cos of x&sup2;.","criteria":["state the reverse chain rule pattern f(g(x))g&prime;(x)","identify that 2xcos(x&sup2;) matches this pattern exactly","identify that sin(x&sup2;) alone is missing the g&prime;(x)=2x factor","conclude that without this factor, no elementary reverse chain rule shortcut applies"],"merit":"The reverse chain rule works on integrands of the exact form f(g(x))&middot;g&prime;(x). In &int;2xcos(x&sup2;)dx, g(x)=x&sup2; has derivative g&prime;(x)=2x, and this factor of 2x is present alongside cos(x&sup2;), so the pattern matches and the integral is sin(x&sup2;)+c. In &int;sin(x&sup2;)dx, there is no accompanying factor of 2x (or any multiple of it) present, so the required g&prime;(x) piece of the pattern is simply missing, and the reverse chain rule shortcut cannot be applied.","excellence":"The reverse chain rule is not a general method for integrating any composite function; it specifically reverses the chain rule of differentiation, and so it only applies to integrands that are structurally of the exact form f(g(x))&middot;g&prime;(x) &mdash; an 'outer' function applied to an 'inner' function, multiplied by that inner function's own derivative. In &int;2xcos(x&sup2;)dx, the inner function is g(x)=x&sup2;, whose derivative g&prime;(x)=2x is exactly the multiplying factor present in the integrand alongside cos(x&sup2;), so this integrand precisely matches the required pattern and integrates directly to sin(x&sup2;)+c. By contrast, &int;sin(x&sup2;)dx has no such accompanying derivative factor at all &mdash; there is no 2x (or any constant multiple of it) present anywhere in the integrand. Without this g&prime;(x) factor, the expression simply does not fit the reverse chain rule's required structure, and in fact &int;sin(x&sup2;)dx has no elementary antiderivative expressible in standard functions at all. This distinction is exactly why students must check for the full f(g(x))&middot;g&prime;(x) pattern, not just the presence of a composite function, before applying the reverse chain rule."}
  ],
  "apply":[
    {"id":"91579-growth-decay-app-01","standard":"91579","topic":"diffeq","subtopic":"growth-decay","question":"A radioactive substance decays according to dN/dt=&minus;kN. If its half-life is known, explain how you would find k.","answer":"The general solution is N=N&#8320;e&#8315;&#8342;&#8348;. At the half-life t=T, N=&frac12;N&#8320;, so &frac12;N&#8320;=N&#8320;e&#8315;&#8342;&#8343;, giving &frac12;=e&#8315;&#8342;&#8343;. Taking natural logs of both sides gives ln(&frac12;)=&minus;kT, so k = ln(2)/T (since ln(&frac12;)=&minus;ln2)."},
    {"id":"91579-area-under-app-01","standard":"91579","topic":"areas","subtopic":"area-under","question":"A city planner models the cross-section of a proposed embankment using the area between y=&radic;x and y=x/2 from x=0 to x=4. Explain how integration would be used to find this cross-sectional area.","answer":"Since &radic;x &ge; x/2 on [0,4] (check: at x=4, &radic;4=2=4/2, they meet; for 0&lt;x&lt;4, &radic;x is larger), the area is &int;&#8320;&#8308;[&radic;x &minus; x/2]dx, integrating the upper curve minus the lower curve over the given interval."},
    {"id":"91579-numerical-app-01","standard":"91579","topic":"areas","subtopic":"numerical","question":"A scientist has velocity data recorded at irregular intervals but cannot find an algebraic formula for velocity as a function of time. Explain why the trapezium rule, rather than direct integration, would be used to estimate distance travelled.","answer":"Direct integration requires an algebraic formula for the function being integrated. Since only discrete data points are available with no known formula, the trapezium rule can still estimate the definite integral (distance = area under the velocity-time graph) using just the recorded data values, without needing to know an explicit function."},
    {"id":"91579-forming-de-app-01","standard":"91579","topic":"diffeq","subtopic":"forming-de","question":"A student solves dy/dx=4x and writes y=2x&sup2; with no constant of integration, since a specific point on the curve was given in the question. Evaluate whether this is acceptable.","answer":"This is only acceptable if the student actually used the given point to correctly determine that the constant equals zero, and should show this working explicitly. Simply omitting c without justification is not acceptable, even if it happens to equal zero &mdash; the process of finding c using the given point must be shown."},
    {"id":"91579-rational-ln-app-01","standard":"91579","topic":"techniques","subtopic":"rational-ln","question":"A student integrates &int;[1/(2x+3)]dx and writes ln|2x+3|+c, without any extra factor. Evaluate whether this is correct.","answer":"This is incorrect. Using the reverse chain rule pattern, the derivative of 2x+3 is 2, so the correct integral needs a compensating factor of &frac12;: &int;[1/(2x+3)]dx = &frac12;ln|2x+3|+c. The student's answer is double what it should be."},
    {"id":"91579-kinematics-app-01","standard":"91579","topic":"diffeq","subtopic":"kinematics","question":"A ball is thrown upward with acceleration a(t)=&minus;10 m/s&sup2; (due to gravity) and initial velocity 15 m/s. Explain how integration is used to find when the ball reaches its maximum height.","answer":"Integrate a(t)=&minus;10 to get v(t)=&minus;10t+c; using v(0)=15 gives c=15, so v(t)=&minus;10t+15. Maximum height occurs when velocity is momentarily zero, so solve 0=&minus;10t+15, giving t=1.5 seconds. (Integrating v(t) again, with an initial displacement condition, would then give the actual maximum height reached.)"}
  ],
  "worked":[
    {"id":"91579-area-under-wrk-01","standard":"91579","topic":"areas","subtopic":"area-under","title":"Area enclosed between two curves","question":"Find the area enclosed between y=x&sup2; and y=2x+3.","plan":["Find the intersection points by setting the two curves equal.","Determine which curve is on top over that interval.","Set up the definite integral of (upper &minus; lower).","Evaluate the integral and state the area."],"answer":"Setting x&sup2;=2x+3: x&sup2;&minus;2x&minus;3=0, so (x&minus;3)(x+1)=0, giving x=&minus;1 and x=3. Testing x=0 (between the intersections): line gives 3, parabola gives 0, so the line 2x+3 is on top. Area = &int;&#8315;&#8321;&sup3;[(2x+3)&minus;x&sup2;]dx = [x&sup2;+3x&minus;x&sup3;/3] from &minus;1 to 3. At x=3: 9+9&minus;9=9. At x=&minus;1: 1&minus;3&minus;(&minus;1/3)=1&minus;3+1/3=&minus;5/3. Area = 9&minus;(&minus;5/3) = 9+5/3 = 32/3 square units.","why":"Correctly identifying which curve is upper before setting up the integral, and carrying the algebra through to a fully simplified fraction, is exactly the complete process an Excellence response needs.","trap":"Integrating (lower &minus; upper) instead of (upper &minus; lower) gives a negative value for what should be a positive area &mdash; always check which curve is on top first."},
    {"id":"91579-forming-de-wrk-01","standard":"91579","topic":"diffeq","subtopic":"forming-de","title":"Solving a differential equation with two conditions","question":"A curve satisfies d&sup2;y/dx&sup2;=12x&minus;4. The curve has a stationary point at (1,5). Find y in terms of x.","plan":["Integrate once to find dy/dx with a constant.","Use the stationary point condition (dy/dx=0 at x=1) to find that constant.","Integrate again to find y with a second constant.","Use the point (1,5) to find the final constant."],"answer":"Integrating: dy/dx=6x&sup2;&minus;4x+c&#8321;. Since (1,5) is a stationary point, dy/dx=0 at x=1: 0=6&minus;4+c&#8321;, so c&#8321;=&minus;2, giving dy/dx=6x&sup2;&minus;4x&minus;2. Integrating again: y=2x&sup3;&minus;2x&sup2;&minus;2x+c&#8322;. Using y=5 at x=1: 5=2&minus;2&minus;2+c&#8322;, so c&#8322;=7. Final answer: y=2x&sup3;&minus;2x&sup2;&minus;2x+7.","why":"Recognising that 'stationary point' is itself a hidden condition on dy/dx (not just a point on the curve) is exactly the kind of connected reasoning that separates Excellence from a purely mechanical integration.","trap":"Forgetting that a stationary point gives TWO pieces of information (a y-value AND dy/dx=0) is a common way to lose one of the two constants needed."},
    {"id":"91579-numerical-wrk-01","standard":"91579","topic":"areas","subtopic":"numerical","title":"Applying the trapezium rule","question":"Use the trapezium rule with 4 strips to estimate &int;&#8320;&#8308;&radic;(1+x&sup3;)dx, given the table of values: x=0,1,2,3,4 gives y=1, 1.414, 3, 5.292, 8.062 (to 3 d.p.).","plan":["Identify h from the number of strips and interval width.","Identify y&#8320;, y&#8345; and the middle y-values.","Substitute into the trapezium rule formula.","Evaluate and give the answer to an appropriate accuracy."],"answer":"h=(4&minus;0)/4=1. y&#8320;=1, y&#8321;=1.414, y&#8322;=3, y&#8323;=5.292, y&#8324;=8.062. Trapezium rule: &frac12;(1)[1+8.062+2(1.414+3+5.292)] = &frac12;[9.062+2(9.706)] = &frac12;[9.062+19.412] = &frac12;(28.474)=14.237.","why":"Correctly separating the first/last y-values from the doubled middle terms, and substituting precisely into the formula, is exactly the careful, error-free execution this Excellence-level numerical method needs.","trap":"Doubling ALL the y-values (including y&#8320; and y&#8345;) rather than only the middle ones is one of the most common trapezium rule errors."},
    {"id":"91579-growth-decay-wrk-01","standard":"91579","topic":"diffeq","subtopic":"growth-decay","title":"Newton's Law of Cooling, fully solved","question":"A cup of coffee at 90&deg;C is left in a room at 20&deg;C. Newton's Law of Cooling gives dT/dt=&minus;k(T&minus;20). After 10 minutes the coffee is 70&deg;C. Find the temperature after 30 minutes.","plan":["Separate variables and integrate to find the general solution.","Use the initial condition to find the overall constant.","Use the given data point to find k.","Substitute t=30 to find the final temperature."],"answer":"Separating and integrating: ln|T&minus;20|=&minus;kt+c, so T=20+Ae&#8315;&#8342;&#8348; (where A=e&#8347;). At t=0, T=90: 90=20+A, so A=70, giving T=20+70e&#8315;&#8342;&#8348;. At t=10, T=70: 70=20+70e&#8315;&#8321;&#8320;&#8342;, so 50=70e&#8315;&#8321;&#8320;&#8342;, e&#8315;&#8321;&#8320;&#8342;=5/7, so &minus;10k=ln(5/7), k=&minus;ln(5/7)/10 &asymp; 0.0336. At t=30: T=20+70e&#8315;&#8320;&middot;&#8320;&#8323;&#8323;&#8318;&times;&sup3;&#8304; &asymp; 20+70(5/7)&sup3; &asymp; 20+70(0.3644)&asymp;20+25.5=45.5&deg;C.","why":"Chaining the general solution, the initial condition, and the given data point together to find k algebraically (using the relationship (5/7)&sup3;, rather than recomputing a fresh decimal for k) shows exactly the fluent, connected working Excellence responses need.","trap":"Forgetting that A is found from the condition at t=0 (not the condition at t=10) is a common source of a completely wrong constant early in the solution."},
    {"id":"91579-rational-ln-wrk-01","standard":"91579","topic":"techniques","subtopic":"rational-ln","title":"Integral requiring a compensating factor","question":"Find &int;[(3x&sup2;+1)/(x&sup3;+x)]dx.","plan":["Differentiate the denominator to compare with the numerator.","Check whether the numerator matches exactly or needs a scale factor.","Apply the ln|f(x)| pattern with any needed adjustment.","State the final simplified answer."],"answer":"The denominator is x&sup3;+x, whose derivative is 3x&sup2;+1 &mdash; this is exactly the numerator, with no scale factor needed. So &int;[(3x&sup2;+1)/(x&sup3;+x)]dx = ln|x&sup3;+x|+c directly.","why":"Explicitly checking the derivative of the denominator before applying the ln pattern (rather than assuming it applies) demonstrates the verification habit that distinguishes a reliable Excellence response.","trap":"Assuming every rational function integrates to a natural log is incorrect &mdash; always differentiate the denominator first and compare it with the numerator before applying this pattern."}

/* ---- Progress schema (v2) ----------------------------------------------
   attempts, visited and confidence are the ORIGINAL fields — untouched,
   so progress saved by earlier versions of Calc-Count keeps working exactly
   as before (coverage and per-standard confidence survive this upgrade).
   practiced / mastered / subtopicConfidence / review are NEW and simply
   default to empty when absent from an older saved record.
     attempts            : {itemId: {tries, correct}}      (legacy + still used)
     visited             : {"standard:subtopic": true}     (legacy — coverage)
     confidence          : {standardId: 1-4}                (legacy — per-standard)
     practiced           : {itemId: true}                   (NEW — "attempted")
     mastered            : {itemId: true}                   (NEW — "succeeded independently")
     subtopicConfidence  : {"standard:subtopic": "confident"|"practice"|"unknown"}
     review              : {"standard:stage:index": true}   (NEW — persisted checkboxes)
   --------------------------------------------------------------------- */
function loadProgress(){
  try{
    const p=JSON.parse(localStorage.getItem("calc_count_excellence_progress")||"{}");
    return {
      attempts:p.attempts||{}, visited:p.visited||{}, confidence:p.confidence||{},
      practiced:p.practiced||{}, mastered:p.mastered||{},
      subtopicConfidence:p.subtopicConfidence||{}, review:p.review||{},
      paperHistory:p.paperHistory||[],
      lastActivity:p.lastActivity||null
    };
  }catch(e){return {attempts:{},visited:{},confidence:{},practiced:{},mastered:{},subtopicConfidence:{},review:{},paperHistory:[],lastActivity:null}}
}
function saveProgress(){
  try{localStorage.setItem("calc_count_excellence_progress",JSON.stringify(progress))}catch(e){}
}
function visit(key){
  progress.visited[key]=true; saveProgress();
}
function markPracticed(id){ if(!id) return; progress.practiced[id]=true; saveProgress(); }
function markMastered(id,ev){ if(ev) ev.stopPropagation(); if(!id) return; progress.practiced[id]=true; progress.mastered[id]=true; saveProgress(); render(); }
function recordResult(id,correct){
  if(!id) return;
  const r=progress.attempts[id]||{tries:0,correct:0};
  r.tries++; if(correct) r.correct++;
  progress.attempts[id]=r;
  progress.practiced[id]=true;
  if(correct) progress.mastered[id]=true; // auto-graded types only (MCQ / match / build): first independent success = mastery signal
  saveProgress();
}
function standardCoverage(id){
  const topics=(topicMap[id]||[]).flatMap(t=>t.subtopics.map(s=>id+":"+s[0]));
  if(!topics.length) return 0;
  const seen=topics.filter(k=>progress.visited[k]).length;
  return Math.round(seen/topics.length*100);
}
function confidenceLabel(id){
  const v=progress.confidence[id]||0;
  return ["Not set yet","Starting out","Developing","Secure","Exam ready"][v]||"Not set yet";
}
function setConfidence(id,v,ev){
  if(ev) ev.stopPropagation();
  progress.confidence[id]=v; saveProgress(); render();
}
function accuracyStats(standardId){
  let tries=0,correct=0;
  allTaggedItems(standardId).forEach(it=>{
    const r=progress.attempts[it.id];
    if(r){tries+=r.tries;correct+=r.correct}
  });
  return {tries,correct,pct: tries? Math.round(correct/tries*100) : null};
}
/* Every tagged (id-bearing) item across recognise/build/explain/apply/worked,
   optionally scoped to one standard. Used for accuracy stats, mastery and
   the "needs work" / "strong areas" dashboard summary. */
function allTaggedItems(standardId){
  const ids = standardId ? [standardId] : Object.keys(standards);
  const out = [];
  ids.forEach(sid=>{
    const s = standards[sid];
    ["recognise","build","explain","apply","worked"].forEach(act=>{
      (s[act]||[]).forEach(it=>out.push(it));
    });
  });
  return out;
}
/* ---- Coverage vs Practice vs Mastery, per sub-topic --------------------
   Coverage : has the student opened this sub-topic at all?
   Practice : how many of its tagged items have they attempted, and how
              accurately (recorded in progress.attempts)?
   Mastery  : of its Explain / Apply / Exam items specifically, how many
              has the student succeeded at *independently* (never counting
              a Show Answer / Reveal click as success)?
   --------------------------------------------------------------------- */
function subtopicStats(standardId, subtopicId){
  const items = allTaggedItems(standardId).filter(it=>it.subtopic===subtopicId);
  let tries=0,correct=0,practiced=0,masteryEligible=0,mastered=0;
  items.forEach(it=>{
    const r=progress.attempts[it.id];
    if(r){tries+=r.tries;correct+=r.correct}
    if(progress.practiced[it.id]) practiced++;
    if(["explain","apply","worked"].includes(it_activity(standardId,it))){
      masteryEligible++;
      if(progress.mastered[it.id]) mastered++;
    }
  });
  function it_activity(sid,item){
    const s=standards[sid];
    for(const act of ["recognise","build","explain","apply","worked"]) if((s[act]||[]).includes(item)) return act;
    return null;
  }
  const visited = !!progress.visited[standardId+":"+subtopicId];
  const conf = progress.subtopicConfidence[standardId+":"+subtopicId] || null;
  return {
    total: items.length,
    covered: visited,
    practicedCount: practiced,
    accuracyPct: tries? Math.round(correct/tries*100) : null,
    masteryPct: masteryEligible? Math.round(mastered/masteryEligible*100) : null,
    confidence: conf
  };
}
function setSubtopicConfidence(standardId, subtopicId, value, ev){
  if(ev) ev.stopPropagation();
  progress.subtopicConfidence[standardId+":"+subtopicId]=value;
  saveProgress(); render();
}
/* Weakest sub-topics with real practice data behind them, for the
   dashboard's "Needs attention" list. Falls back to nothing rather than
   guessing when there isn't enough data yet. */
function weakSubtopics(limit){
  const rows=[];
  Object.keys(topicMap).forEach(sid=>{
    (topicMap[sid]||[]).forEach(t=>{
      t.subtopics.forEach(st=>{
        const stat=subtopicStats(sid, st[0]);
        if(stat.practicedCount>0 || stat.accuracyPct!==null){
          rows.push({standard:sid, topic:t.id, topicTitle:t.title, subtopic:st[0], subTitle:st[1], ...stat});
        }
      });
    });
  });
  return rows
    .filter(r=>r.accuracyPct!==null && r.accuracyPct<75)
    .sort((a,b)=>(a.accuracyPct??100)-(b.accuracyPct??100))
    .slice(0,limit||4);
}
function strongSubtopics(limit){
  const rows=[];
  Object.keys(topicMap).forEach(sid=>{
    (topicMap[sid]||[]).forEach(t=>{
      t.subtopics.forEach(st=>{
        const stat=subtopicStats(sid, st[0]);
        if(stat.accuracyPct!==null) rows.push({standard:sid, subTitle:st[1], ...stat});
      });
    });
  });
  return rows.filter(r=>r.accuracyPct>=75).sort((a,b)=>b.accuracyPct-a.accuracyPct).slice(0,limit||3);
}

/* ---- Sub-topic-aware question pools -------------------------------------
   When a student has drilled down to Standard -> Topic -> Sub-topic and
   picked an activity, every question shown must actually belong to that
   sub-topic (this was the site's biggest gap — see project notes). The
   guided pathway (no sub-topic chosen) keeps drawing from the whole
   standard, exactly as before. Falls back to the whole standard only if a
   sub-topic genuinely has no tagged items yet for that activity. */
let activePool=null, activePoolKey=null;
function shuffle(arr){
  const a=arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function poolKey(activity){ return state.standard+":"+(state.topic||"_")+":"+(state.subtopic||"_")+":"+activity; }
function getPool(s, activity){
  const all = s[activity]||[];
  const key = poolKey(activity);
  if(state.topic && state.subtopic){
    const filtered = all.filter(it=>it.topic===state.topic && it.subtopic===state.subtopic);
    if(filtered.length){
      if(activePoolKey!==key){ activePool=shuffle(filtered); activePoolKey=key; }
      return activePool;
    }
  }
  if(activePoolKey!==key){ activePool=all; activePoolKey=key; }
  return activePool;
}
function currentPool(activity){ return getPool(current(), activity); }

/* Theme: follows the system by default; the toggle cycles
   system -> dark -> light -> system, remembered on this device only. */
function syncTheme(){
  let t=null;
  try{ t=localStorage.getItem("calc_count_theme"); }catch(e){}
  if(t) document.documentElement.setAttribute("data-theme", t);
}
function toggleTheme(){
  const cur=document.documentElement.getAttribute("data-theme");
  const next = cur==="dark" ? "light" : (cur==="light" ? null : "dark");
  if(next) document.documentElement.setAttribute("data-theme", next);
  else document.documentElement.removeAttribute("data-theme");
  try{ localStorage.setItem("calc_count_theme", next||""); }catch(e){}
}

/* ---- Search: a small always-available index of every sub-topic and
   glossary term across all three standards. ---- */
function buildSearchIndex(){
  const rows=[];
  Object.values(standards).forEach(s=>{
    (topicMap[s.id]||[]).forEach(t=>{
      t.subtopics.forEach(sub=>{
        rows.push({standard:s.id,standardTitle:s.title,colour:s.colour,topic:t.id,topicTitle:t.title,sub:sub[0],subTitle:sub[1],kind:"topic"});
      });
    });
    (glossary[s.id]||[]).forEach(([term,def])=>{
      rows.push({standard:s.id,standardTitle:s.title,colour:s.colour,term,def,kind:"glossary"});
    });
  });
  return rows;
}
let searchIndexCache=null; // built lazily on first open, see openSearch()

function openSearch(){
  if(!searchIndexCache) searchIndexCache=buildSearchIndex();
  const wrap=document.createElement("div");
  wrap.id="searchOverlay";
  wrap.className="overlay";
  wrap.onclick=e=>{if(e.target===wrap) closeSearch()};
  wrap.innerHTML=`<div class="overlay-panel">
    <div class="p-4 border-b" style="border-color:var(--line)">
      <div class="flex items-center gap-3">
        ${icon("search",19)}
        <input id="searchInput" type="text" placeholder="Search a topic or glossary term across all three standards..." class="flex-1 outline-none text-base bg-transparent" style="font-family:var(--font-body)" oninput="renderSearchResults(this.value)">
        <button onclick="closeSearch()" class="p-1.5 rounded-lg" style="color:var(--muted)">${icon("close",18)}</button>
      </div>
    </div>
    <div id="searchResults" class="p-3"></div>
  </div>`;
  document.body.appendChild(wrap);
  document.getElementById("searchInput").focus();
}
function closeSearch(){document.getElementById("searchOverlay")?.remove()}
function renderSearchResults(qRaw){
  const q=(qRaw||"").trim().toLowerCase();
  const box=document.getElementById("searchResults");
  if(!box) return;
  if(!q){box.innerHTML=`<div class="text-sm p-4" style="color:var(--muted)">Start typing — for example "chain rule", "modulus" or "trapezium".</div>`;return}
  const hits=searchIndexCache.filter(r=>{
    if(r.kind==="topic") return (r.subTitle+" "+r.topicTitle+" "+r.standardTitle).toLowerCase().includes(q);
    return (r.term+" "+r.def).toLowerCase().includes(q);
  }).slice(0,18);
  if(!hits.length){box.innerHTML=`<div class="text-sm p-4" style="color:var(--muted)">No matches. Try a shorter or different word.</div>`;return}
  box.innerHTML=hits.map(r=>{
    if(r.kind==="topic"){
      return `<button onclick="selectSearchResult('${r.standard}','${r.topic}','${r.sub}')" class="w-full text-left p-3 rounded-lg flex items-center justify-between gap-3" style="border:1px solid transparent" onmouseover="this.style.background='var(--surface-2)'" onmouseout="this.style.background='transparent'">

        <span class="kicker text-${r.colour}-600">AS ${r.standard}</span>
      </button>`;
    }
    return `<button onclick="selectSearchResult('${r.standard}',null,null,'${escapeJS(r.term)}')" class="w-full text-left p-3 rounded-lg flex items-center justify-between gap-3" onmouseover="this.style.background='var(--surface-2)'" onmouseout="this.style.background='transparent'">

        <span class="kicker text-${r.colour}-600">AS ${r.standard}</span>
      </button>`;
  }).join("");
}

function stableOptionOrder(prompt, count){
  // Deterministic shuffle so options stay put while a question is on screen,
  // but different questions distribute the correct answer across A/B/C/D.
  let seed = 0;
  for(let i=0;i<prompt.length;i++) seed = (seed * 31 + prompt.charCodeAt(i)) >>> 0;
  const arr = Array.from({length:count},(_,i)=>i);
  for(let i=count-1;i>0;i--){
    seed = (1664525 * seed + 1013904223) >>> 0;
    const j = seed % (i+1);
    [arr[i],arr[j]] = [arr[j],arr[i]];
  }
  return arr;
}
